<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>POSTITON OL</title>
    <style>
      :root {
        color-scheme: dark;
        --root: #07070b;
        --surface: rgba(255, 255, 255, 0.055);
        --surface-strong: rgba(255, 255, 255, 0.09);
        --text: #f7f7fb;
        --muted: #8e8e99;
        --dim: #575763;
        --blue: #0a84ff;
        --cyan: #18f2ff;
        --purple: #bf5af2;
        --red: #ff453a;
        --green: #32d74b;
        --amber: #ff9f0a;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        background: var(--root);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      input,
      button {
        font: inherit;
      }

      input {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
      }

      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        margin: 0;
        -webkit-appearance: none;
      }

      .mono {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      .app {
        min-height: 100dvh;
        max-width: 430px;
        margin: 0 auto;
        padding-bottom: calc(108px + env(safe-area-inset-bottom));
        background:
          linear-gradient(#06050a 0 118px, transparent 118px),
          radial-gradient(circle at 84% 18%, rgba(191, 90, 242, 0.34), transparent 34%),
          radial-gradient(circle at 4% 25%, rgba(24, 242, 255, 0.18), transparent 34%),
          var(--root);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      }

      header {
        position: sticky;
        top: 0;
        z-index: 6;
        padding: calc(25px + env(safe-area-inset-top)) 18px 18px;
        background: #06050a;
      }

      h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 900;
        letter-spacing: -0.05em;
      }

      .sub {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 15px;
        font-weight: 400;
      }

      .alert-strip {
        display: none;
        margin-top: 12px;
        border-radius: 18px;
        padding: 10px 12px;
        background: rgba(255, 69, 58, 0.2);
        color: #ffd6d3;
        font-size: 12px;
        font-weight: 800;
        box-shadow: 0 0 28px rgba(255, 69, 58, 0.18);
      }

      .alert-strip.on {
        display: block;
        animation: pulseRed 1.05s ease-in-out infinite;
      }

      main {
        padding: 42px 8px 0;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0 4px 12px;
        color: var(--muted);
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      .card {
        overflow: hidden;
        margin-bottom: 12px;
        border-radius: 30px;
        background: var(--surface);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      .global {
        padding: 21px 18px 18px;
        background: rgba(255, 255, 255, 0.058);
      }

      .global-top {
        display: flex;
        gap: 16px;
        justify-content: space-between;
        align-items: center;
      }

      .hero-label {
        color: var(--muted);
        font-size: 15px;
        font-weight: 300;
      }

      .hero-value {
        display: block;
        margin-top: 13px;
        font-size: 44px;
        font-weight: 900;
        letter-spacing: -0.06em;
      }

      .progress-ring {
        --progress: 0deg;
        position: relative;
        display: grid;
        width: 94px;
        height: 94px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 50%;
        background: conic-gradient(from -90deg, var(--purple) 0deg, var(--cyan) var(--progress), rgba(255, 255, 255, 0.11) var(--progress), rgba(255, 255, 255, 0.11) 360deg);
      }

      .progress-ring::after {
        position: absolute;
        inset: 8px;
        border-radius: inherit;
        background: #101016;
        content: "";
      }

      .progress-ring strong {
        position: relative;
        z-index: 1;
        font-size: 17px;
        font-weight: 900;
      }

      .capital-grid,
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .capital-grid {
        margin-top: 24px;
      }

      .capital-item,
      .field {
        min-height: 66px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.045);
        padding: 14px 13px;
      }

      .capital-item label,
      .field label {
        display: block;
        margin-bottom: 5px;
        color: var(--muted);
        font-size: 15px;
        font-weight: 300;
      }

      .capital-item input {
        font-size: 22px;
        font-weight: 850;
        letter-spacing: -0.03em;
      }

      .field:focus-within,
      .capital-item:focus-within {
        background: rgba(10, 132, 255, 0.14);
      }

      .position-card {
        position: relative;
        overflow: visible;
        padding-left: 6px;
        min-width: 0;
        margin-bottom: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .position-card::before {
        position: absolute;
        top: 8px;
        bottom: 8px;
        left: 2px;
        width: 3px;
        border-radius: 999px;
        background: var(--green);
        box-shadow: 0 0 10px rgba(50, 215, 75, 0.45);
        content: "";
      }

      .position-card.risk::before {
        background: var(--red);
        box-shadow: 0 0 12px rgba(255, 69, 58, 0.75);
        animation: pulseRed 0.86s ease-in-out infinite;
      }

      .position-main {
        display: grid;
        grid-template-columns:
          minmax(0, 1.55fr)
          minmax(0, 0.82fr)
          minmax(0, 0.72fr)
          minmax(0, 0.72fr)
          minmax(0, 0.88fr)
          minmax(0, 0.82fr)
          minmax(0, 0.9fr)
          minmax(0, 0.68fr);
        gap: 0;
        align-items: stretch;
        width: 100%;
        min-width: 0;
        min-height: 34px;
        padding: 2px 4px 2px 10px;
        color: inherit;
        background: transparent;
      }

      .monitor-scroll {
        position: relative;
        overflow-x: visible;
        padding-bottom: 4px;
        margin: 0;
      }

      .monitor-table {
        min-width: 0;
        width: 100%;
        overflow: visible;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.04);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .table-head {
        display: grid;
        grid-template-columns:
          minmax(0, 1.55fr)
          minmax(0, 0.82fr)
          minmax(0, 0.72fr)
          minmax(0, 0.72fr)
          minmax(0, 0.88fr)
          minmax(0, 0.82fr)
          minmax(0, 0.9fr)
          minmax(0, 0.68fr);
        min-width: 0;
        width: 100%;
        margin: 0;
        padding: 0 4px 3px 10px;
        color: var(--muted);
        font-size: 8px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .table-head span,
      .stock-cell,
      .data-cell {
        padding: 0 2px;
      }

      .stock-cell {
        display: flex;
        flex-direction: column;
        gap: 2px;
        justify-content: center;
        min-width: 0;
      }

      .stock-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
      }

      .stock-actions .pill {
        min-height: 14px;
        padding: 2px 4px;
        font-size: 7px;
      }

      .stock-cell input:first-child {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .stock-cell input:last-child {
        color: var(--muted);
        font-size: 7px;
        text-transform: uppercase;
      }

      .data-cell {
        display: flex;
        min-width: 0;
        flex-direction: column;
        justify-content: center;
      }

      .data-cell small {
        display: none;
      }

      .data-cell strong,
      .data-cell input {
        overflow: hidden;
        font-size: 7px;
        font-weight: 750;
        letter-spacing: -0.03em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .badge {
        border-radius: 4px;
        min-width: 0;
        width: 100%;
        padding: 2px 3px;
        background: rgba(50, 215, 75, 0.18);
        color: var(--green);
        font-size: 7px;
        font-weight: 800;
        text-align: center;
        white-space: nowrap;
      }

      .badge.red {
        background: rgba(255, 69, 58, 0.18);
        color: #ffb4ae;
        animation: pulseRed 0.86s ease-in-out infinite;
      }

      .badge.amber {
        background: rgba(255, 159, 10, 0.16);
        color: var(--amber);
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px 8px;
        margin-top: 14px;
      }

      .summary small,
      .metric span:first-child {
        display: block;
        color: var(--muted);
        font-size: 10px;
        font-weight: 300;
      }

      .summary strong {
        display: block;
        overflow: hidden;
        margin-top: 3px;
        font-size: 14px;
        font-weight: 850;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .pill {
        border: 0;
        border-radius: 999px;
        min-height: 24px;
        padding: 4px 7px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
        font-size: 10px;
        font-weight: 850;
        line-height: 1;
      }

      .pill.blue {
        color: var(--cyan);
        background: rgba(24, 242, 255, 0.1);
      }

      .pill.red {
        color: #ffb4ae;
        background: rgba(255, 69, 58, 0.13);
      }

      .detail {
        display: none;
        padding: 0 14px 15px;
      }

      .open .detail {
        display: block;
      }

      .trade-detail {
        display: none;
        padding: 0 14px 15px;
      }

      .trade .trade-detail {
        display: block;
      }

      .metrics {
        margin-top: 10px;
        border-radius: 22px;
        background: rgba(0, 0, 0, 0.18);
        padding: 13px;
      }

      .trade-panel {
        margin-top: 10px;
        border-radius: 24px;
        background: rgba(24, 242, 255, 0.07);
        padding: 13px;
      }

      .trade-panel.locked {
        background: rgba(92, 18, 18, 0.7);
      }

      .metrics h3 {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.06em;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 14px;
        font-size: 13px;
      }

      .metric strong {
        display: block;
        margin-top: 3px;
        font-weight: 850;
      }

      .bottom {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 7;
        max-width: 430px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
        background: rgba(7, 7, 11, 0.74);
        backdrop-filter: blur(24px);
      }

      .action,
      .link {
        border: 0;
        color: var(--blue);
        background: transparent;
        font-weight: 850;
      }

      .action {
        min-height: 52px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.075);
        font-size: 12px;
      }

      .drawer-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .drawer-title {
        margin: 0;
        font-size: 18px;
        font-weight: 900;
      }

      .status-chip {
        border-radius: 999px;
        padding: 6px 10px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.08);
        font-size: 12px;
        font-weight: 900;
      }

      .status-chip.ok {
        color: var(--green);
        background: rgba(50, 215, 75, 0.13);
      }

      .status-chip.bad {
        color: #ffd6d3;
        background: rgba(255, 69, 58, 0.22);
      }

      .rr-line {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 12px;
      }

      .rr-box {
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.07);
        padding: 11px;
      }

      .rr-box small {
        display: block;
        color: var(--muted);
        font-size: 10px;
      }

      .rr-box strong {
        display: block;
        margin-top: 4px;
        font-size: 16px;
        font-weight: 900;
      }

      .red {
        color: var(--red);
      }

      .green {
        color: var(--green);
      }

      .amber {
        color: var(--amber);
      }

      .purple {
        color: var(--purple);
      }

      @keyframes pulseRed {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.56;
        }
      }

    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>POSTITON OL</h1>
        <p class="sub">交易员个人操作分析驾驶舱 · HTML 主页版</p>
        <div class="alert-strip" id="topAlert">风险脉冲：有持仓逼近或跌破止损线，请立即处理。</div>
      </header>

      <main>
        <section>
          <div class="section-head">
            <span>GLOBAL HEADER</span>
            <strong class="green">资金安全视图</strong>
          </div>
          <div class="card global">
            <div class="global-top">
              <div>
                <span class="hero-label">总市值</span>
                <input class="hero-value mono" id="totalAssets" type="number" inputmode="decimal" placeholder="0.00" readonly />
                <p class="sub">最近保存：<span id="updatedAt">--</span></p>
              </div>
              <div class="progress-ring" id="progressRing">
                <strong id="progress">0.00%</strong>
              </div>
            </div>
            <div class="capital-grid">
              <div class="capital-item"><label>本金</label><input id="costCapital" class="mono" type="number" inputmode="decimal" /></div>
              <div class="capital-item"><label>欠款</label><input id="debtAmount" class="mono" type="number" inputmode="decimal" /></div>
              <div class="capital-item"><label>目标盈利</label><input id="targetProfit" class="mono" type="number" inputmode="decimal" /></div>
              <div class="capital-item"><label>当前盈利</label><input id="currentProfit" class="mono" type="number" inputmode="decimal" readonly /></div>
              <div class="capital-item"><label>目标达成率</label><strong class="mono" id="progressCopy">0.00%</strong></div>
            </div>
          </div>
        </section>

        <section>
          <div class="section-head">
            <span>POSITION MONITOR</span>
            <button class="link" onclick="addRow()">+ 新交易</button>
          </div>
          <div id="rows"></div>
        </section>
      </main>

      <input id="importFile" type="file" accept="application/json" hidden />

      <nav class="bottom">
        <button class="action" onclick="saveLocal()">保存</button>
        <button class="action" onclick="exportJson()">导出</button>
        <button class="action" onclick="document.getElementById('importFile').click()">导入</button>
        <button class="action red" onclick="resetAll()">重置</button>
      </nav>
    </div>

    <script>
      const STORAGE_KEY = "postiton_ol_html_state_v1";
      const globalKeys = ["costCapital", "debtAmount", "targetProfit"];
      const openRows = new Set();
      const openTrades = new Set();
      let lastRiskPulse = false;
      let state = {
        globalHeader: defaultGlobalHeader(),
        rows: [],
        updatedAt: "--"
      };

      function defaultGlobalHeader() {
        return { totalAssets: "", costCapital: "", debtAmount: "", targetProfit: "", currentProfit: "" };
      }

      function normalizeGlobalHeader(globalHeader = {}) {
        return { ...defaultGlobalHeader(), ...globalHeader };
      }

      function id() {
        return Math.random().toString(36).slice(2, 11);
      }

      function emptyRow() {
        return normalizeRow({ id: id() });
      }

      function normalizeRow(row) {
        return {
          id: row.id || id(),
          symbol: row.symbol || "",
          name: row.name || "",
          position: row.position || "",
          plannedPosition: row.plannedPosition || "",
          currentPrice: row.currentPrice || "",
          costPrice: row.costPrice || "",
          dayPnl: row.dayPnl || "",
          stopLossAmount: row.stopLossAmount || "",
          execBuyPrice: row.execBuyPrice || "",
          execDayPosition: row.execDayPosition || "",
          execStopAmount: row.execStopAmount || "",
          execStopPrice: row.execStopPrice || "",
          rrRatio: row.rrRatio || "2",
          addCount: row.addCount || "",
          addPrice: row.addPrice || "",
          addStopAmount: row.addStopAmount || "",
          addHighPrice: row.addHighPrice || ""
        };
      }

      function n(value) {
        const text = String(value ?? "").trim();
        if (!text) return null;
        const parsed = Number(text);
        return Number.isFinite(parsed) ? parsed : null;
      }

      function money(value) {
        return value === null ? "--" : value.toFixed(2);
      }

      function qty(value) {
        return value === null ? "--" : Math.floor(value).toString();
      }

      function pct(value) {
        return value === null ? "--" : value.toFixed(2) + "%";
      }

      function calc(row) {
        const cp = n(row.currentPrice);
        const cost = n(row.costPrice);
        const pos = n(row.position);
        const ppos = n(row.plannedPosition);
        const slimit = n(row.stopLossAmount);
        const explicitStop = n(row.execStopPrice);
        const total = cp === null || pos === null ? null : cp * pos;
        const marketValue = cost === null || pos === null ? null : cost * pos;
        let equiv = null;
        if (ppos !== null && ppos !== 0 && pos !== null) {
          if (pos >= ppos && total !== null) equiv = total / ppos;
          else if (cost !== null) equiv = cost;
        }
        const pnl = cp === null || cost === null || pos === null ? null : (cp - cost) * pos;
        const dayPnl = n(row.dayPnl);
        const recovery = cp === null || cp === 0 || cost === null || cp >= cost ? null : ((cost - cp) / cp) * 100;
        const derivedStop = cost === null || slimit === null || pos === null || pos === 0 ? null : cost - slimit / pos;
        const stop = explicitStop !== null ? explicitStop : derivedStop;
        const distance = cp === null || cp === 0 || stop === null ? null : ((cp - stop) / cp) * 100;
        const over = ppos !== null && ppos !== 0 && pos !== null && pos / ppos > 1;
        const breach = distance !== null && distance < 2;
        const actualLoss = pnl === null || pnl > 0 ? 0 : Math.abs(pnl);
        const addCount = n(row.addCount);
        const addPrice = n(row.addPrice);
        const addStopAmount = n(row.addStopAmount);
        const addHighPrice = n(row.addHighPrice);
        const addStopPrice = addCount === null || addCount === 0 || addPrice === null || addStopAmount === null ? null : (addCount * addPrice - addStopAmount) / addCount;
        const pullbackTakeProfitPrice = addHighPrice === null || addPrice === null ? null : (addHighPrice - addPrice) * 0.66 + addPrice;
        return {
          total,
          marketValue,
          equiv,
          pnl,
          dayPnl,
          recovery,
          stop,
          distance,
          alert: breach ? "异常" : over ? "超预仓" : "正常",
          breach,
          over,
          actualLoss,
          addStopPrice,
          pullbackTakeProfitPrice
        };
      }

      function calcTotalAssets() {
        return state.rows.reduce((sum, rawRow) => {
          const marketValue = calc(normalizeRow(rawRow)).marketValue;
          return marketValue === null ? sum : sum + marketValue;
        }, 0);
      }

      function setRowValue(rowId, key, value, shouldRender = false) {
        state.rows = state.rows.map((row) => (row.id === rowId ? normalizeRow({ ...row, [key]: value }) : row));
        if (shouldRender) render();
      }

      function finishRowEdit() {
        renderRows();
        renderGlobal();
      }

      function addRow() {
        const row = emptyRow();
        state.rows.push(row);
        openRows.add(row.id);
        openTrades.add(row.id);
        render();
      }

      function toggleRow(rowId) {
        if (openRows.has(rowId)) openRows.delete(rowId);
        else openRows.add(rowId);
        renderRows();
      }

      function toggleTrade(rowId, event) {
        if (event) event.stopPropagation();
        if (openTrades.has(rowId)) openTrades.delete(rowId);
        else openTrades.add(rowId);
        renderRows();
      }

      function deleteRow(rowId, event) {
        if (event) event.stopPropagation();
        const row = state.rows.find((item) => item.id === rowId);
        const label = row && (row.name || row.symbol) ? `「${row.name || row.symbol}」` : "这条持仓";
        if (!confirm(`确定删除${label}吗？`)) return;
        state.rows = state.rows.filter((item) => item.id !== rowId);
        openRows.delete(rowId);
        openTrades.delete(rowId);
        renderRows();
        renderGlobal();
      }

      function renderGlobal() {
        state.globalHeader.totalAssets = calcTotalAssets().toFixed(2);
        const principal = n(state.globalHeader.costCapital) || 0;
        const debt = n(state.globalHeader.debtAmount) || 0;
        state.globalHeader.currentProfit = (n(state.globalHeader.totalAssets) - principal - debt).toFixed(2);
        const totalAssetsInput = document.getElementById("totalAssets");
        totalAssetsInput.value = state.globalHeader.totalAssets;
        document.getElementById("currentProfit").value = state.globalHeader.currentProfit;
        globalKeys.forEach((key) => {
          const input = document.getElementById(key);
          if (document.activeElement !== input) input.value = state.globalHeader[key] || "";
        });
        const target = n(state.globalHeader.targetProfit);
        const current = n(state.globalHeader.currentProfit);
        const rate = !target || current === null ? 0 : (current / target) * 100;
        const progress = rate.toFixed(2) + "%";
        document.getElementById("progress").textContent = progress;
        document.getElementById("progressCopy").textContent = progress;
        document.getElementById("progressRing").style.setProperty("--progress", Math.max(0, Math.min(rate, 100)) * 3.6 + "deg");
        document.getElementById("updatedAt").textContent = state.updatedAt || "--";
      }

      function renderRows() {
        const box = document.getElementById("rows");
        let hasRisk = false;
        const body = state.rows.map((rawRow) => {
          const row = normalizeRow(rawRow);
          const m = calc(row);
          if (m.breach) hasRisk = true;
          const open = openRows.has(row.id);
          const tradeOpen = openTrades.has(row.id);
          const pnlClass = m.pnl === null ? "" : m.pnl > 0 ? "red" : m.pnl < 0 ? "green" : "";
          const badgeClass = m.breach ? "badge red" : m.over ? "badge amber" : "badge";
          const tradeStatus = tradePanelStatus(row, m);
          return `
            <article class="card position-card ${m.breach ? "risk" : ""} ${open ? "open" : ""} ${tradeOpen ? "trade" : ""}">
              <div class="position-main">
                <div class="stock-cell">
                  <input value="${escapeHtml(row.symbol)}" placeholder="代码" oninput="setRowValue('${row.id}', 'symbol', this.value)" onblur="finishRowEdit()" />
                  <input value="${escapeHtml(row.name)}" placeholder="名称" oninput="setRowValue('${row.id}', 'name', this.value)" onblur="finishRowEdit()" />
                  <div class="stock-actions">
                    <button class="pill blue" type="button" onclick="toggleTrade('${row.id}', event)">${tradeOpen ? "收起" : "加仓"}</button>
                    <button class="pill" type="button" onclick="toggleRow('${row.id}'); event.stopPropagation()">${open ? "收起" : "风控"}</button>
                    <button class="pill red" type="button" onclick="deleteRow('${row.id}', event)">删</button>
                  </div>
                </div>
                ${dataCell("市值", money(m.marketValue))}
                ${rowInput(row, "currentPrice", "现价")}
                ${rowInput(row, "costPrice", "成本")}
                ${rowInput(row, "plannedPosition", "预计持仓")}
                ${rowInput(row, "position", "持仓数量")}
                ${dataCell("浮动盈亏", money(m.pnl), pnlClass)}
                <div class="data-cell"><span class="${badgeClass}">${m.alert}</span></div>
              </div>
              <div class="detail">
                <div class="grid">
                  ${input(row, "position", "持仓数量")}
                  ${input(row, "plannedPosition", "预仓数量")}
                  ${input(row, "currentPrice", "现价")}
                  ${input(row, "costPrice", "成本")}
                  ${input(row, "dayPnl", "当日盈亏")}
                  ${input(row, "stopLossAmount", "计划止损额")}
                </div>
                <div class="metrics">
                  <h3>持仓状态雷达</h3>
                  <div class="metric-grid mono">
                    ${metric("预仓转换成本价", money(m.equiv))}
                    ${metric("恢复涨幅", pct(m.recovery), m.recovery !== null ? "purple" : "")}
                    ${metric("止损价", money(m.stop), m.breach ? "red" : "")}
                    ${metric("离场空间", pct(m.distance), m.breach ? "red" : "")}
                  </div>
                </div>
              </div>
              <div class="trade-detail">
                <div class="trade-panel">
                  <div class="drawer-head">
                    <div>
                      <p class="drawer-title">加仓执行区</p>
                      <p class="sub">输入加仓参数，自动生成止损价位和盈利回退止盈价</p>
                    </div>
                    <span class="status-chip ${tradeStatus.className}">${tradeStatus.text}</span>
                  </div>
                  <div class="grid">
                    ${input(row, "addCount", "加仓数")}
                    ${input(row, "addPrice", "加仓位")}
                    ${input(row, "addStopAmount", "止损额", row.stopLossAmount || "0.00")}
                    ${input(row, "addHighPrice", "高点位")}
                  </div>
                  <div class="rr-line mono">
                    <div class="rr-box"><small>止损价位</small><strong>${money(m.addStopPrice)}</strong></div>
                    <div class="rr-box"><small>盈利回退止盈价</small><strong>${money(m.pullbackTakeProfitPrice)}</strong></div>
                    <div class="rr-box"><small>公式</small><strong>回退 66%</strong></div>
                  </div>
                </div>
              </div>
            </article>`;
        }).join("");
        box.innerHTML = `
          <div class="monitor-scroll">
            <div class="monitor-table">
              <div class="table-head">
                <span>股票名称</span>
                <span>市值</span>
                <span>现价</span>
                <span>成本</span>
                <span>预计持仓</span>
                <span>持仓数量</span>
                <span>浮动盈亏</span>
                <span>状态</span>
              </div>
              ${body}
            </div>
          </div>`;
        updateRiskPulse(hasRisk);
      }

      function input(row, key, label, placeholder = "0.00") {
        return `<div class="field"><label>${label}</label><input class="mono" type="number" inputmode="decimal" value="${escapeHtml(row[key])}" placeholder="${escapeHtml(placeholder)}" oninput="setRowValue('${row.id}', '${key}', this.value)" onblur="finishRowEdit()" /></div>`;
      }

      function summary(label, value, className = "") {
        return `<div><small>${label}</small><strong class="${className}">${value}</strong></div>`;
      }

      function dataCell(label, value, className = "") {
        return `<div class="data-cell mono"><small>${label}</small><strong class="${className}">${value}</strong></div>`;
      }

      function rowInput(row, key, label, placeholder = "0.00") {
        return `<div class="data-cell"><small>${label}</small><input class="mono" type="number" inputmode="decimal" value="${escapeHtml(row[key])}" placeholder="${escapeHtml(placeholder)}" oninput="setRowValue('${row.id}', '${key}', this.value)" onblur="finishRowEdit()" /></div>`;
      }

      function metric(label, value, className = "") {
        return `<div class="metric"><span>${label}</span><strong class="${className}">${value}</strong></div>`;
      }

      function updateRiskPulse(hasRisk) {
        document.getElementById("topAlert").classList.toggle("on", hasRisk);
        if (hasRisk && !lastRiskPulse && navigator.vibrate) navigator.vibrate([45, 70, 45]);
        lastRiskPulse = hasRisk;
      }

      function tradePanelStatus(row, m) {
        if (n(row.addCount) === 0) return { text: "加仓数无效", className: "bad" };
        if (m.addStopPrice === null || m.pullbackTakeProfitPrice === null) return { text: "待输入", className: "" };
        return { text: "已生成", className: "ok" };
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[char]);
      }

      function render() {
        state.rows = state.rows.map(normalizeRow);
        renderGlobal();
        renderRows();
      }

      function saveLocal() {
        state.updatedAt = new Date().toLocaleString("zh-CN", { hour12: false });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        renderGlobal();
        alert("已保存到浏览器本地存储");
      }

      function exportJson() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "postiton-ol-data.json";
        a.click();
        URL.revokeObjectURL(url);
      }

      function resetAll() {
        if (!confirm("确定要清空当前页面数据吗？")) return;
        state = { globalHeader: defaultGlobalHeader(), rows: Array.from({ length: 4 }, emptyRow), updatedAt: "--" };
        openRows.clear();
        openTrades.clear();
        render();
      }

      globalKeys.forEach((key) => {
        document.addEventListener("input", (event) => {
          if (event.target && event.target.id === key) {
            state.globalHeader[key] = event.target.value;
            renderGlobal();
          }
        });
      });

      document.getElementById("importFile").addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        state = JSON.parse(await file.text());
        state.globalHeader = normalizeGlobalHeader(state.globalHeader);
        event.target.value = "";
        render();
      });

      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          state = JSON.parse(saved);
          state.globalHeader = normalizeGlobalHeader(state.globalHeader);
          state.rows = (state.rows || []).map(normalizeRow);
        } catch {
          state.globalHeader = defaultGlobalHeader();
          state.rows = Array.from({ length: 4 }, emptyRow);
        }
      } else {
        state.rows = Array.from({ length: 4 }, emptyRow);
      }
      render();
    </script>
  </body>
</html>
