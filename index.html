<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>POSTITON OL</title>
    <style>
      :root {
        color-scheme: dark;
        --root: #1c1c1e;
        --surface: #28282b;
        --surface-strong: #2e2e32;
        --line: rgba(255, 255, 255, 0.08);
        --text: #f0f1f4;
        --muted: #8a8a8f;
        --dim: #5a5a60;
        --blue: #4a90e2;
        --cyan: #18f2ff;
        --purple: #b78bff;
        --red: #f04b4b;
        --green: #2ec866;
        --amber: #f4c843;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        background: var(--root);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      input,
      button {
        font: inherit;
      }

      input {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
      }

      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        margin: 0;
        -webkit-appearance: none;
      }

      .mono {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      .app {
        min-height: 100dvh;
        max-width: 430px;
        margin: 0 auto;
        padding-bottom: calc(108px + env(safe-area-inset-bottom));
        background: var(--root);
      }

      header {
        position: sticky;
        top: 0;
        z-index: 6;
        padding: calc(10px + env(safe-area-inset-top)) 14px 6px;
        background: var(--root);
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .sub {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 400;
      }

      .alert-strip {
        display: none;
        margin-top: 10px;
        border-radius: 10px;
        padding: 9px 12px;
        background: rgba(74, 144, 226, 0.14);
        color: #c9dcf2;
        font-size: 12px;
        font-weight: 600;
      }

      .alert-strip.on {
        display: block;
      }

      main {
        padding: 12px 14px 0;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
      }

      .card {
        overflow: hidden;
        margin-bottom: 10px;
        border-radius: 14px;
        background: var(--surface);
      }

      .global {
        padding: 14px;
        background: transparent;
        margin-bottom: 4px;
      }

      .global-top {
        display: flex;
        gap: 10px;
        justify-content: space-between;
        align-items: flex-end;
      }

      .hero-label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.02em;
      }

      .hero-value {
        display: block;
        margin-top: 2px;
        font-size: 30px;
        font-weight: 900;
        letter-spacing: -0.03em;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      .progress-ring {
        --progress: 0deg;
        position: relative;
        display: grid;
        width: 46px;
        height: 46px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 50%;
        background: conic-gradient(from -90deg, var(--purple) 0deg, var(--blue) var(--progress), rgba(255, 255, 255, 0.08) var(--progress), rgba(255, 255, 255, 0.08) 360deg);
      }

      .progress-ring::after {
        position: absolute;
        inset: 4px;
        border-radius: inherit;
        background: var(--root);
        content: "";
      }

      .progress-ring strong {
        position: relative;
        z-index: 1;
        font-size: 10px;
        font-weight: 800;
      }

      .capital-grid,
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .capital-grid {
        margin-top: 12px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        padding: 10px;
        border-radius: 12px;
        background: var(--surface);
      }

      .capital-item,
      .field {
        min-height: 0;
        border-radius: 8px;
        background: transparent;
        padding: 4px 4px;
      }

      .capital-item label,
      .field label {
        display: block;
        margin-bottom: 2px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 400;
      }

      .capital-item input,
      .capital-item strong {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: -0.02em;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      .field:focus-within,
      .capital-item:focus-within {
        background: rgba(74, 144, 226, 0.08);
      }

      .position-card {
        position: relative;
        overflow: visible;
        padding-left: 6px;
        min-width: 0;
        margin-bottom: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .position-group {
        margin-bottom: 10px;
      }

      .position-add-history-row-wrap {
        overflow: hidden;
        background: rgba(0, 0, 0, 0.22);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      .position-add-history-row {
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        background: rgba(24, 242, 255, 0.045);
      }

      .position-test-row2-wrap {
        overflow: hidden;
        background: rgba(0, 0, 0, 0.18);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .position-test-row2 {
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        background: rgba(191, 90, 242, 0.06);
      }

      .test2-tag {
        background: rgba(191, 90, 242, 0.18);
        color: var(--purple);
      }

      .stock-cell-history .test2-sub {
        display: block;
        margin-top: 2px;
        font-size: 6px;
        line-height: 1.2;
        text-align: center;
        opacity: 0.85;
      }

      .stock-cell-history {
        align-items: center;
        justify-content: center;
      }

      .history-tag {
        display: inline-block;
        padding: 2px 5px;
        border-radius: 999px;
        background: rgba(24, 242, 255, 0.12);
        color: var(--cyan);
        font-size: 7px;
        font-weight: 850;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      .position-card::before {
        position: absolute;
        top: 8px;
        bottom: 8px;
        left: 2px;
        width: 3px;
        border-radius: 999px;
        background: var(--green);
        box-shadow: 0 0 10px rgba(50, 215, 75, 0.45);
        content: "";
      }

      .position-card.risk::before {
        background: var(--red);
        box-shadow: 0 0 12px rgba(255, 69, 58, 0.75);
        animation: pulseRed 0.86s ease-in-out infinite;
      }

      .position-main {
        display: grid;
        grid-template-columns:
          minmax(0, 1.5fr)
          minmax(0, 0.78fr)
          minmax(0, 0.7fr)
          minmax(0, 0.7fr)
          minmax(0, 0.82fr)
          minmax(0, 0.76fr)
          minmax(0, 0.72fr)
          minmax(0, 0.76fr)
          minmax(0, 0.62fr);
        gap: 0;
        align-items: stretch;
        width: 100%;
        min-width: 0;
        min-height: 34px;
        padding: 2px 4px 2px 10px;
        color: inherit;
        background: transparent;
      }

      .monitor-scroll {
        position: relative;
        overflow-x: visible;
        padding-bottom: 4px;
        margin: 0;
      }

      .monitor-table {
        min-width: 0;
        width: 100%;
        overflow: visible;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.04);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .table-head {
        display: grid;
        grid-template-columns:
          minmax(0, 1.5fr)
          minmax(0, 0.78fr)
          minmax(0, 0.7fr)
          minmax(0, 0.7fr)
          minmax(0, 0.82fr)
          minmax(0, 0.76fr)
          minmax(0, 0.72fr)
          minmax(0, 0.76fr)
          minmax(0, 0.62fr);
        min-width: 0;
        width: 100%;
        margin: 0;
        padding: 0 4px 3px 10px;
        color: var(--muted);
        font-size: 8px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .table-head span,
      .stock-cell,
      .data-cell {
        padding: 0 2px;
      }

      .stock-cell {
        display: flex;
        flex-direction: column;
        gap: 2px;
        justify-content: center;
        min-width: 0;
      }

      .stock-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
      }

      .stock-actions .pill {
        min-height: 14px;
        padding: 2px 4px;
        font-size: 7px;
      }

      .stock-cell .stock-code-input {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .pill.quote {
        color: var(--purple);
        background: rgba(191, 90, 242, 0.15);
      }

      .pill.quote.loading {
        opacity: 0.6;
        pointer-events: none;
      }

      .data-cell {
        display: flex;
        min-width: 0;
        flex-direction: column;
        justify-content: center;
      }

      .data-cell small {
        display: none;
      }

      .data-cell-named small {
        display: block;
        margin-bottom: 2px;
        color: var(--muted);
        font-size: 6px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .data-cell strong,
      .data-cell input {
        overflow: hidden;
        font-size: 7px;
        font-weight: 750;
        letter-spacing: -0.03em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .badge {
        border-radius: 4px;
        min-width: 0;
        width: 100%;
        padding: 2px 3px;
        background: rgba(50, 215, 75, 0.18);
        color: var(--green);
        font-size: 7px;
        font-weight: 800;
        text-align: center;
        white-space: nowrap;
      }

      .badge.red {
        background: rgba(255, 69, 58, 0.18);
        color: #ffb4ae;
        animation: pulseRed 0.86s ease-in-out infinite;
      }

      .badge.amber {
        background: rgba(255, 159, 10, 0.16);
        color: var(--amber);
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px 8px;
        margin-top: 14px;
      }

      .summary small,
      .metric span:first-child {
        display: block;
        color: var(--muted);
        font-size: 10px;
        font-weight: 300;
      }

      .summary strong {
        display: block;
        overflow: hidden;
        margin-top: 3px;
        font-size: 14px;
        font-weight: 850;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .pill {
        border: 0;
        border-radius: 999px;
        min-height: 24px;
        padding: 4px 7px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
        font-size: 10px;
        font-weight: 850;
        line-height: 1;
      }

      .pill.blue {
        color: var(--cyan);
        background: rgba(24, 242, 255, 0.1);
      }

      .pill.red {
        color: #ffb4ae;
        background: rgba(255, 69, 58, 0.13);
      }

      .detail {
        display: none;
        padding: 0 14px 15px;
      }

      .detail .risk-intro {
        margin-bottom: 12px;
      }

      .detail .risk-intro h3 {
        margin: 0 0 6px;
        color: var(--text);
        font-size: 13px;
        font-weight: 900;
      }

      .detail .risk-intro .sub {
        margin: 0;
        font-size: 11px;
      }

      .open .detail {
        display: block;
      }

      .trade-detail {
        display: none;
        padding: 0 14px 15px;
      }

      .trade .trade-detail {
        display: block;
      }

      .metrics {
        margin-top: 10px;
        border-radius: 22px;
        background: rgba(0, 0, 0, 0.18);
        padding: 13px;
      }

      .trade-panel {
        margin-top: 10px;
        border-radius: 24px;
        background: rgba(24, 242, 255, 0.07);
        padding: 13px;
      }

      .trade-panel.locked {
        background: rgba(92, 18, 18, 0.7);
      }

      .trade-panel .merge-row {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .trade-panel .merge-row .pill {
        min-height: 28px;
        padding: 4px 10px;
        font-size: 11px;
      }

      .detail .confirm-row {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .detail .confirm-row .pill {
        min-height: 28px;
        padding: 4px 10px;
        font-size: 11px;
      }

      .metrics h3 {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.06em;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 14px;
        font-size: 13px;
      }

      .metric strong {
        display: block;
        margin-top: 3px;
        font-weight: 850;
      }

      .bottom {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 7;
        max-width: 430px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
        background: rgba(7, 7, 11, 0.74);
        backdrop-filter: blur(24px);
      }

      .action,
      .link {
        border: 0;
        color: var(--blue);
        background: transparent;
        font-weight: 850;
      }

      .action {
        min-height: 52px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.075);
        font-size: 12px;
      }

      .drawer-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .drawer-title {
        margin: 0;
        font-size: 18px;
        font-weight: 900;
      }

      .status-chip {
        border-radius: 999px;
        padding: 6px 10px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.08);
        font-size: 12px;
        font-weight: 900;
      }

      .status-chip.ok {
        color: var(--green);
        background: rgba(50, 215, 75, 0.13);
      }

      .status-chip.bad {
        color: #ffd6d3;
        background: rgba(255, 69, 58, 0.22);
      }

      .rr-line {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-top: 12px;
      }

      .rr-box {
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.07);
        padding: 11px;
      }

      .rr-box small {
        display: block;
        color: var(--muted);
        font-size: 10px;
      }

      .rr-box strong {
        display: block;
        margin-top: 4px;
        font-size: 16px;
        font-weight: 900;
      }

      .red {
        color: var(--red);
      }

      .green {
        color: var(--green);
      }

      .amber {
        color: var(--amber);
      }

      .purple {
        color: var(--purple);
      }

      @keyframes pulseRed {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.56;
        }
      }

      /* 第二部分 POSITION MONITOR：表格内显示倍数 (1.05 × 1.2 = 1.26) */
      .section-monitor {
        --fs: 1.2;
        --fs-table: 1.26;
        font-size: calc(1rem * var(--fs));
      }

      .section-monitor .section-head {
        font-size: calc(17px * var(--fs));
      }

      .section-monitor .link {
        font-size: calc(14px * var(--fs));
      }

      .section-monitor .table-head {
        font-size: calc(8px * var(--fs) * var(--fs-table));
      }

      .section-monitor .stock-actions .pill {
        font-size: calc(7px * var(--fs) * var(--fs-table));
      }

      .section-monitor .stock-cell .stock-code-input {
        font-size: calc(9px * var(--fs) * var(--fs-table));
      }

      .section-monitor .data-cell-named small {
        font-size: calc(6px * var(--fs) * var(--fs-table));
      }

      .section-monitor .data-cell strong,
      .section-monitor .data-cell input {
        font-size: calc(7px * var(--fs) * var(--fs-table));
      }

      .section-monitor .badge {
        font-size: calc(7px * var(--fs) * var(--fs-table));
      }

      .section-monitor .history-tag {
        font-size: calc(7px * var(--fs) * var(--fs-table));
      }

      .section-monitor .test2-sub {
        font-size: calc(6px * var(--fs) * var(--fs-table));
      }

      .section-monitor .pill {
        font-size: calc(10px * var(--fs));
      }

      .section-monitor .field {
        min-height: 38px;
        padding: 5px 8px;
        border-radius: 12px;
      }

      .section-monitor .field label {
        margin-bottom: 2px;
        font-size: calc(10px * var(--fs));
      }

      .section-monitor .field input {
        font-size: calc(13px * var(--fs));
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .section-monitor .metrics {
        margin-top: 8px;
        padding: 10px;
        border-radius: 16px;
      }

      .section-monitor .trade-panel {
        margin-top: 8px;
        padding: 10px;
        border-radius: 16px;
      }

      .section-monitor .grid {
        gap: 8px;
      }

      .section-monitor .metric-grid {
        gap: 8px 10px;
      }

      .section-monitor .detail,
      .section-monitor .trade-detail {
        padding: 0 10px 10px;
      }

      .section-monitor .detail .risk-intro {
        margin-bottom: 8px;
      }

      .section-monitor .detail .risk-intro h3 {
        margin: 0 0 4px;
        font-size: calc(13px * var(--fs));
      }

      .section-monitor .metrics h3 {
        margin: 0 0 6px;
      }

      .section-monitor .detail .confirm-row,
      .section-monitor .trade-panel .merge-row {
        margin-top: 8px;
      }

      .section-monitor .rr-line {
        margin-top: 8px;
        gap: 8px;
      }

      .section-monitor .rr-box {
        padding: 8px;
        border-radius: 12px;
      }

      .section-monitor .detail .risk-intro .sub,
      .section-monitor .metrics .sub,
      .section-monitor .trade-panel .sub,
      .section-monitor .merge-row .sub,
      .section-monitor .confirm-row .sub {
        font-size: calc(11px * var(--fs));
      }

      .section-monitor .trade-panel .merge-row .pill,
      .section-monitor .detail .confirm-row .pill {
        font-size: calc(11px * var(--fs));
      }

      .section-monitor .metrics h3 {
        font-size: calc(11px * var(--fs));
      }

      .section-monitor .metric-grid {
        font-size: calc(13px * var(--fs));
      }

      .section-monitor .summary small,
      .section-monitor .metric span:first-child {
        font-size: calc(10px * var(--fs));
      }

      .section-monitor .summary strong {
        font-size: calc(14px * var(--fs));
      }

      .section-monitor .drawer-title {
        font-size: calc(18px * var(--fs));
      }

      .section-monitor .status-chip {
        font-size: calc(12px * var(--fs));
      }

      .section-monitor .rr-box small {
        font-size: calc(10px * var(--fs));
      }

      .section-monitor .rr-box strong {
        font-size: calc(16px * var(--fs));
      }

      /* ====== 券商风格主题（broker）====== */
      .broker {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .broker .market-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 4px 0 6px;
      }

      .broker .market-head-left {
        display: flex;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
      }

      .broker .market-flag {
        font-size: 13px;
      }

      .broker .market-name {
        font-size: 14px;
        font-weight: 800;
        color: var(--text);
      }

      .broker .market-value {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 14px;
        font-weight: 700;
        color: var(--text);
      }

      .broker .market-head .link {
        color: var(--blue);
        font-size: 12px;
        font-weight: 700;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(74, 144, 226, 0.1);
      }

      .broker .market-stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 4px 10px;
        padding: 4px 2px 10px;
        border-bottom: 1px solid var(--line);
      }

      .broker .market-stats > div {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .broker .market-stats label {
        color: var(--muted);
        font-size: 10px;
      }

      .broker .market-stats strong {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 13px;
        font-weight: 800;
      }

      .broker .pos-head {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        padding: 10px 2px 8px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        text-align: center;
      }

      .broker .pos-head .num {
        text-align: center;
      }

      .broker .pos-head > span:first-child {
        text-align: left;
      }

      .broker .pos-head small {
        color: var(--dim);
        font-size: 11px;
        font-weight: 500;
      }

      .broker .pos-block {
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
        position: relative;
      }

      .broker .pos-block::before {
        content: "";
        position: absolute;
        left: -10px;
        top: 10px;
        bottom: 10px;
        width: 3px;
        border-radius: 999px;
        background: var(--green);
        opacity: 0.6;
      }

      .broker .pos-block.over::before {
        background: var(--amber);
        opacity: 0.9;
      }

      .broker .pos-block.risk::before {
        background: var(--red);
        opacity: 1;
        animation: pulseRed 0.9s ease-in-out infinite;
      }

      .broker .pos-row {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        padding: 2px 2px;
        align-items: center;
      }

      .broker .pos-cell {
        display: flex;
        flex-direction: column;
        min-width: 0;
        align-items: center;
        text-align: center;
      }

      .broker .pos-row > .pos-cell:first-child,
      .broker .pos-extra > .pos-cell:first-child {
        align-items: flex-start;

      }

      .broker .pos-cell.num {
        align-items: center;
        text-align: center;
      }

      .broker .pos-cell strong {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.01em;
        line-height: 1.2;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
      }

      .broker .pos-cell small {
        margin-top: 1px;
        color: var(--muted);
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
      }

      .broker .pos-cell .code-input {
        width: 100%;
        font-size: 16px;
        font-weight: 800;
        color: var(--text);
        background: transparent;
        border: 0;
        outline: 0;
        padding: 0;
        text-transform: uppercase;
      }

      .broker .pos-cell .code-name {
        margin-top: 1px;
        color: var(--muted);
        font-size: 11px;
      }

      .broker .pos-cell .red { color: var(--red); }
      .broker .pos-cell .green { color: var(--green); }
      .broker .pos-cell .amber { color: var(--amber); }

      .broker .pos-actions {
        display: flex;
        gap: 6px;
        padding: 6px 0 2px;
      }

      .broker .action-chip {
        flex: 1;
        border: 0;
        border-radius: 8px;
        padding: 8px 0;
        font-size: 12px;
        font-weight: 700;
        color: var(--text);
        background: var(--surface);
        cursor: pointer;
        text-align: center;
      }

      .broker .action-chip.quote { color: var(--purple); }
      .broker .action-chip.primary { color: var(--blue); }
      .broker .action-chip.warn { color: var(--amber); }
      .broker .action-chip.danger { color: var(--red); }
      .broker .action-chip.loading { opacity: 0.55; pointer-events: none; }

      .broker .pos-extra {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        padding: 8px 2px;
        background: rgba(255, 255, 255, 0.018);
        border-radius: 8px;
        margin-top: 6px;
        text-align: center;
        align-items: center;
      }

      .broker .pos-extra .tag {
        display: inline-block;
        align-self: flex-start;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      .broker .pos-extra.test2 .tag {
        background: rgba(183, 139, 255, 0.15);
        color: var(--purple);
      }

      .broker .pos-extra.hist .tag {
        background: rgba(74, 144, 226, 0.15);
        color: var(--blue);
      }

      .broker .status-chip-mini {
        display: inline-block;
        margin-top: 4px;
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .broker .status-chip-mini.normal { background: rgba(46, 200, 102, 0.14); color: var(--green); }
      .broker .status-chip-mini.over   { background: rgba(244, 200, 67, 0.14); color: var(--amber); }
      .broker .status-chip-mini.risk   { background: rgba(240, 75, 75, 0.16); color: #ffadad; }

      /* 让风控/加仓展开区在新主题下也好看一些 */
      .broker .position-card {
        padding-left: 0;
        background: transparent;
        border-radius: 0;
        box-shadow: none;
        margin-bottom: 0;
        overflow: visible;
      }

      .broker .position-card::before {
        display: none;
      }

      .broker .pos-row .code-input {
        text-transform: uppercase;
      }

      .broker .position-card .detail,
      .broker .position-card .trade-detail {
        padding: 0 0 10px;
      }

      .broker .position-card .metrics,
      .broker .position-card .trade-panel {
        background: var(--surface);
        margin-top: 8px;
        padding: 10px;
        border-radius: 10px;
      }

      .broker .position-card .metrics h3,
      .broker .position-card .trade-panel .drawer-title {
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .broker .position-card .field {
        min-height: 38px;
        background: rgba(255, 255, 255, 0.03);
        padding: 5px 8px;
        border-radius: 8px;
      }

      .broker .position-card .field label {
        font-size: 10px;
      }

      .broker .position-card .field input {
        font-size: 13px;
        font-weight: 800;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      .broker .position-card .rr-box {
        background: rgba(255, 255, 255, 0.03);
      }

      .broker .position-card .rr-box small {
        font-size: 10px;
      }

      .broker .position-card .rr-box strong {
        font-size: 14px;
      }

      /* 底部操作栏：贴近底部 tab bar 视觉 */
      .broker-bottom {
        background: rgba(10, 12, 16, 0.92);
        backdrop-filter: blur(20px);
        border-top: 1px solid var(--line);
      }

      .broker-bottom .action {
        border-radius: 10px;
        background: var(--surface);
        font-size: 12px;
        font-weight: 700;
      }

    </style>
  </head>
  <body>
    <div class="app broker">
      <header>
        <h1>POSTITON OL</h1>
        <p class="sub">交易员个人操作分析驾驶舱</p>
        <div class="alert-strip" id="topAlert">风险脉冲：有持仓逼近或跌破止损线，请立即处理。</div>
      </header>

      <main>
        <section>
          <div class="global">
            <div class="global-top">
              <div>
                <span class="hero-label">总市值 · USD</span>
                <strong class="hero-value" id="totalAssets">0.0</strong>
                <p class="sub">最近保存：<span id="updatedAt">--</span></p>
              </div>
              <div class="progress-ring" id="progressRing">
                <strong id="progress">0.0%</strong>
              </div>
            </div>
            <div class="capital-grid">
              <div class="capital-item"><label>本金</label><input id="costCapital" class="mono" type="number" inputmode="decimal" /></div>
              <div class="capital-item"><label>欠款</label><input id="debtAmount" class="mono" type="number" inputmode="decimal" /></div>
              <div class="capital-item"><label>目标盈利</label><input id="targetProfit" class="mono" type="number" inputmode="decimal" /></div>
              <div class="capital-item"><label>当前盈利</label><strong class="mono" id="currentProfit">0.0</strong></div>
              <div class="capital-item"><label>目标达成率</label><strong class="mono" id="progressCopy">0.0%</strong></div>
            </div>
          </div>
        </section>

        <section class="section-monitor">
          <div class="market-head">
            <div class="market-head-left">
              <span class="market-flag">🇺🇸</span>
              <strong class="market-name">美股</strong>
              <strong class="market-value mono" id="marketValueTotal">0.0</strong>
            </div>
            <button class="link" onclick="addRow()">+ 新交易</button>
          </div>
          <div class="market-stats">
            <div><label>持仓市值</label><strong class="mono" id="statMarket">0.0</strong></div>
            <div><label>浮动盈亏</label><strong class="mono" id="statPnl">0.0</strong></div>
            <div><label>当日盈亏</label><strong class="mono" id="statDayPnl">0.0</strong></div>
          </div>
          <div class="pos-head">
            <span>名称/代码</span>
            <span class="num">现价<small> / 成本</small></span>
            <span class="num">市值<small> / 数量</small></span>
            <span class="num">盈亏<small> / 加仓止损</small></span>
          </div>
          <div id="rows"></div>
        </section>
      </main>

      <input id="importFile" type="file" accept="application/json" hidden />

      <nav class="bottom broker-bottom">
        <button class="action" onclick="saveLocal()">保存</button>
        <button class="action" onclick="exportJson()">导出</button>
        <button class="action" onclick="document.getElementById('importFile').click()">导入</button>
        <button class="action red" onclick="resetAll()">重置</button>
      </nav>
    </div>

    <script>
      const STORAGE_KEY = "postiton_ol_html_state_v1";
      const globalKeys = ["costCapital", "debtAmount", "targetProfit"];
      const openRows = new Set();
      const openTrades = new Set();
      let lastRiskPulse = false;
      let state = {
        globalHeader: defaultGlobalHeader(),
        rows: [],
        updatedAt: "--"
      };

      function defaultGlobalHeader() {
        return { totalAssets: "", costCapital: "", debtAmount: "", targetProfit: "", currentProfit: "" };
      }

      function normalizeGlobalHeader(globalHeader = {}) {
        return { ...defaultGlobalHeader(), ...globalHeader };
      }

      function id() {
        return Math.random().toString(36).slice(2, 11);
      }

      function emptyRow() {
        return normalizeRow({ id: id() });
      }

      const FMT1 = new Intl.NumberFormat("en-US", {
        minimumFractionDigits: 1,
        maximumFractionDigits: 1
      });

      function shareLabel(value) {
        if (value === null) return "--";
        return FMT1.format(value);
      }

      function normalizeAddHistEntry(h) {
        return {
          addPrice: h.addPrice || "",
          addCount: h.addCount || "",
          addStopAmount: h.addStopAmount || "",
          currentPriceAtMerge: h.currentPriceAtMerge || ""
        };
      }

      function normalizeRow(row) {
        return {
          id: row.id || id(),
          symbol: row.symbol || row.name || "",
          name: "",
          position: row.position || "",
          plannedPosition: row.plannedPosition || "",
          currentPrice: row.currentPrice || "",
          costPrice: row.costPrice || "",
          dayPnl: row.dayPnl || "",
          stopLossAmount: row.stopLossAmount || "",
          execBuyPrice: row.execBuyPrice || "",
          execDayPosition: row.execDayPosition || "",
          execStopAmount: row.execStopAmount || "",
          execStopPrice: row.execStopPrice || "",
          rrRatio: row.rrRatio || "2",
          addCount: row.addCount || "",
          addPrice: row.addPrice || "",
          addStopAmount: row.addStopAmount || "",
          addHistory: Array.isArray(row.addHistory) ? row.addHistory.map(normalizeAddHistEntry) : []
        };
      }

      function n(value) {
        const text = String(value ?? "").trim();
        if (!text) return null;
        const parsed = Number(text);
        return Number.isFinite(parsed) ? parsed : null;
      }

      function money(value) {
        return value === null ? "--" : FMT1.format(value);
      }

      function signed(value) {
        if (value === null) return "--";
        const sign = value > 0 ? "+" : "";
        return sign + FMT1.format(value);
      }

      function qty(value) {
        return value === null ? "--" : Math.floor(value).toString();
      }

      function pct(value) {
        return value === null ? "--" : value.toFixed(2) + "%";
      }

      function calc(row) {
        const cp = n(row.currentPrice);
        const cost = n(row.costPrice);
        const pos = n(row.position);
        const ppos = n(row.plannedPosition);
        const slimit = n(row.stopLossAmount);
        const explicitStop = n(row.execStopPrice);
        const total = cp === null || pos === null ? null : cp * pos;
        const marketValue = cost === null || pos === null ? null : cost * pos;
        let equiv = null;
        if (ppos !== null && ppos !== 0 && pos !== null) {
          if (pos >= ppos && total !== null) equiv = total / ppos;
          else if (cost !== null) equiv = cost;
        }
        const pnl = cp === null || cost === null || pos === null ? null : (cp - cost) * pos;
        const dayPnl = n(row.dayPnl);
        const recovery = cp === null || cp === 0 || cost === null || cp >= cost ? null : ((cost - cp) / cp) * 100;
        const derivedStop = cost === null || slimit === null || pos === null || pos === 0 ? null : cost - slimit / pos;
        const stop = explicitStop !== null ? explicitStop : derivedStop;
        const distance = cp === null || cp === 0 || stop === null ? null : ((cp - stop) / cp) * 100;
        const over = ppos !== null && ppos !== 0 && pos !== null && pos / ppos > 1;
        const breach = distance !== null && distance < 2;
        const actualLoss = pnl === null || pnl > 0 ? 0 : Math.abs(pnl);
        const addCount = n(row.addCount);
        const addPrice = n(row.addPrice);
        const addStopAmount = n(row.addStopAmount);
        const addStopPrice = addCount === null || addCount === 0 || addPrice === null || addStopAmount === null ? null : (addCount * addPrice - addStopAmount) / addCount;
        return {
          total,
          marketValue,
          equiv,
          pnl,
          dayPnl,
          recovery,
          stop,
          distance,
          alert: breach ? "异常" : over ? "超预仓" : "正常",
          breach,
          over,
          actualLoss,
          addStopPrice
        };
      }

      function calcHistLeg(h) {
        const entry = normalizeAddHistEntry(h);
        const ap = n(entry.addPrice);
        const ac = n(entry.addCount);
        const asa = n(entry.addStopAmount);
        const cpSnap = n(entry.currentPriceAtMerge);
        const marketValue = ap !== null && ac !== null ? ap * ac : null;
        const addStopPrice =
          ac === null || ac === 0 || ap === null || asa === null ? null : (ac * ap - asa) / ac;
        const pnl = cpSnap !== null && ap !== null && ac !== null ? (cpSnap - ap) * ac : null;
        return {
          marketValue,
          addStopPrice,
          pnl,
          displayCp: cpSnap,
          displayCost: ap,
          planned: ac,
          position: ac
        };
      }

      function calcAddPreviewMarket(row) {
        const ap = n(row.addPrice);
        const ac = n(row.addCount);
        return ap !== null && ac !== null ? ap * ac : null;
      }

      function calcAddTotals(rawRow) {
        const row = normalizeRow(rawRow);
        let totalCount = 0;
        let totalAmount = 0;
        let totalStopAmount = 0;
        let hasCount = false;
        let hasAmount = false;
        let hasStop = false;

        function addLeg(price, count, stopAmt) {
          const ac = n(count);
          const ap = n(price);
          const asa = n(stopAmt);
          if (ac !== null) {
            totalCount += ac;
            hasCount = true;
          }
          if (ap !== null && ac !== null) {
            totalAmount += ap * ac;
            hasAmount = true;
          }
          if (asa !== null) {
            totalStopAmount += asa;
            hasStop = true;
          }
        }

        addLeg(row.addPrice, row.addCount, row.addStopAmount);
        (row.addHistory || []).forEach((h) => {
          const e = normalizeAddHistEntry(h);
          addLeg(e.addPrice, e.addCount, e.addStopAmount);
        });

        return {
          totalCount: hasCount ? totalCount : null,
          totalAmount: hasAmount ? totalAmount : null,
          totalStopAmount: hasStop ? totalStopAmount : null
        };
      }

      function calcRowMarketTotal(rawRow) {
        const row = normalizeRow(rawRow);
        const base = calc(row).marketValue;
        const add = calcAddPreviewMarket(row);
        if (base === null && add === null) return null;
        return (base || 0) + (add || 0);
      }

      function calcTotalAssets() {
        return state.rows.reduce((sum, rawRow) => {
          const total = calcRowMarketTotal(rawRow);
          return total === null ? sum : sum + total;
        }, 0);
      }

      function setRowValue(rowId, key, value, shouldRender = false) {
        state.rows = state.rows.map((row) => (row.id === rowId ? normalizeRow({ ...row, [key]: value }) : row));
        if (shouldRender) render();
      }

      async function fetchQuote(rowId, event) {
        if (event) event.stopPropagation();
        const row = state.rows.find((r) => r.id === rowId);
        if (!row) return;
        const code = (row.symbol || "").trim();
        if (!code) {
          alert("请先填写股票代码（如 AAPL）");
          return;
        }
        const btn = document.querySelector(`[data-quote-btn="${rowId}"]`);
        const originalText = btn ? btn.textContent : "";
        if (btn) {
          btn.classList.add("loading");
          btn.textContent = "获取中…";
        }
        try {
          const resp = await fetch(`/api/quote?code=${encodeURIComponent(code)}`, {
            cache: "no-store"
          });
          const data = await resp.json();
          if (!resp.ok || typeof data.price !== "number") {
            throw new Error(data.error || `HTTP ${resp.status}`);
          }
          const price = data.price.toFixed(2);
          state.rows = state.rows.map((r) =>
            r.id !== rowId ? r : normalizeRow({ ...r, currentPrice: price })
          );
          const t = data.time ? new Date(data.time) : new Date();
          state.updatedAt = `${t.toLocaleTimeString()} · ${data.source || "src"}`;
          render();
          if (typeof data.changePct === "number") {
            const sign = data.changePct >= 0 ? "+" : "";
            const sym = (data.symbol || code).toUpperCase();
            console.info(
              `${sym} $${price} (${sign}${data.changePct.toFixed(2)}%) via ${data.source}`
            );
          }
        } catch (e) {
          alert(`获取「${code}」失败：${e.message || e}`);
        } finally {
          const btnNow = document.querySelector(`[data-quote-btn="${rowId}"]`);
          if (btnNow) {
            btnNow.classList.remove("loading");
            btnNow.textContent = originalText || "刷新价";
          }
        }
      }

      let tabNavigating = false;

      function getTabInputs() {
        const root = document.querySelector(".app");
        if (!root) return [];
        return Array.from(root.querySelectorAll('input:not([readonly]):not([type="file"]):not([hidden])')).filter((el) => {
          if (el.offsetParent === null) return false;
          const card = el.closest(".position-card");
          if (!card) return true;
          if (el.closest(".detail") && !card.classList.contains("open")) return false;
          if (el.closest(".trade-detail") && !card.classList.contains("trade")) return false;
          return true;
        });
      }

      function refocusInput(meta) {
        if (!meta) return;
        let el = null;
        if (meta.id) el = document.getElementById(meta.id);
        else if (meta.rowId && meta.field) {
          el = document.querySelector(`input[data-row-id="${meta.rowId}"][data-field="${meta.field}"]`);
        }
        if (!el) return;
        el.focus();
        const pos = Math.min(meta.caret ?? el.value.length, String(el.value).length);
        try {
          el.setSelectionRange(pos, pos);
        } catch (_) {
          /* number inputs may not support selection in some browsers */
        }
      }

      function focusTabRelative(shift) {
        const inputs = getTabInputs();
        const current = document.activeElement;
        const idx = inputs.indexOf(current);
        if (idx === -1) return;
        const nextIdx = shift ? idx - 1 : idx + 1;
        if (nextIdx < 0 || nextIdx >= inputs.length) return;
        const target = inputs[nextIdx];
        const meta = {
          id: target.id || "",
          rowId: target.dataset.rowId || "",
          field: target.dataset.field || ""
        };
        tabNavigating = true;
        renderRows();
        renderGlobal();
        tabNavigating = false;
        refocusInput(meta);
      }

      function htmlTestRow2Main(rawRow, m, tradeStatus) {
        const row = normalizeRow(rawRow);
        const t = calcAddTotals(rawRow);
        const pendingCount = n(row.addCount);
        return `
                <div class="pos-cell">
                  <span class="tag">测试行2</span>
                  <small style="margin-top:4px">加仓合计</small>
                </div>
                <div class="pos-cell num">
                  <strong>${money(n(row.addPrice))}</strong>
                  <small>当前: ${shareLabel(pendingCount)}</small>
                </div>
                <div class="pos-cell num">
                  <strong>${money(t.totalAmount)}</strong>
                  <small>${shareLabel(t.totalCount)}</small>
                </div>
                <div class="pos-cell num">
                  <strong>${money(m.addStopPrice)}</strong>
                  <small>${money(t.totalStopAmount)}</small>
                </div>`;
      }

      function syncAddPreview(rowId) {
        const raw = state.rows.find((r) => r.id === rowId);
        if (!raw) return;
        const row = normalizeRow(raw);
        const m = calc(row);
        const tradeStatus = tradePanelStatus(row, m);
        const wrap = document.querySelector(`[data-test-row2="${rowId}"]`);
        if (wrap) {
          wrap.innerHTML = htmlTestRow2Main(row, m, tradeStatus);
        }
        const panel = document.querySelector(`[data-add-panel="${rowId}"]`);
        if (panel) {
          const stopEl = panel.querySelector("[data-add-stop-price]");
          if (stopEl) stopEl.textContent = money(m.addStopPrice);
          const chip = panel.querySelector("[data-add-status]");
          if (chip) {
            chip.textContent = tradeStatus.text;
            chip.className = `status-chip ${tradeStatus.className}`;
          }
        }
        const mainStop = document.querySelector(`[data-main-add-stop="${rowId}"] strong`);
        if (mainStop) mainStop.textContent = money(m.addStopPrice);
        const mainMv = document.querySelector(`[data-main-market="${rowId}"] strong`);
        if (mainMv) mainMv.textContent = money(calcRowMarketTotal(raw));
        renderGlobal();
      }

      let finishRowEditTimer = null;

      function finishRowEdit() {
        if (tabNavigating) return;
        clearTimeout(finishRowEditTimer);
        finishRowEditTimer = setTimeout(() => {
          const active = document.activeElement;
          if (active && active.closest(".confirm-row, .merge-row, .stock-actions")) return;
          renderRows();
          renderGlobal();
        }, 0);
      }

      function actionBtn(handler) {
        return `type="button" class="pill blue action-btn" onmousedown="${handler}; event.preventDefault(); event.stopPropagation()"`;
      }

      function addRow() {
        const row = emptyRow();
        state.rows.push(row);
        openRows.add(row.id);
        openTrades.add(row.id);
        render();
      }

      function toggleRow(rowId) {
        if (openRows.has(rowId)) openRows.delete(rowId);
        else openRows.add(rowId);
        renderRows();
      }

      function toggleTrade(rowId, event) {
        if (event) event.stopPropagation();
        if (openTrades.has(rowId)) openTrades.delete(rowId);
        else openTrades.add(rowId);
        renderRows();
      }

      function deleteRow(rowId, event) {
        if (event) event.stopPropagation();
        const row = state.rows.find((item) => item.id === rowId);
        const label = row && row.symbol ? `「${row.symbol}」` : "这条持仓";
        if (!confirm(`确定删除${label}吗？`)) return;
        state.rows = state.rows.filter((item) => item.id !== rowId);
        openRows.delete(rowId);
        openTrades.delete(rowId);
        renderRows();
        renderGlobal();
      }

      function formatPositionStored(value) {
        if (value === null || Number.isNaN(value)) return "";
        if (Math.abs(value % 1) < 1e-9) return String(Math.round(value));
        return value.toFixed(2);
      }

      const riskFieldKeys = ["currentPrice", "costPrice", "plannedPosition", "position", "dayPnl", "stopLossAmount"];

      function formatRiskStored(key, raw) {
        const v = n(raw);
        if (v === null) return "";
        if (key === "plannedPosition" || key === "position") return formatPositionStored(v);
        return v.toFixed(2);
      }

      function confirmRisk(rowId, event) {
        if (event) event.stopPropagation();
        const patch = {};
        document.querySelectorAll(`input[data-row-id="${rowId}"][data-field]`).forEach((el) => {
          if (!el.closest(".detail")) return;
          const key = el.dataset.field;
          if (!riskFieldKeys.includes(key)) return;
          patch[key] = el.value;
        });
        state.rows = state.rows.map((r) => {
          if (r.id !== rowId) return r;
          const merged = normalizeRow({ ...r, ...patch });
          const formatted = {};
          riskFieldKeys.forEach((key) => {
            formatted[key] = formatRiskStored(key, merged[key]);
          });
          return normalizeRow({ ...merged, ...formatted });
        });
        openRows.delete(rowId);
        render();
      }

      function flushTradeInputsFromDom(rowId) {
        const addKeys = ["addPrice", "addCount", "addStopAmount"];
        const patch = {};
        document.querySelectorAll(`input[data-row-id="${rowId}"][data-field]`).forEach((el) => {
          if (!el.closest(".trade-detail")) return;
          const key = el.dataset.field;
          if (addKeys.includes(key)) patch[key] = el.value;
        });
        if (!Object.keys(patch).length) return;
        state.rows = state.rows.map((r) => (r.id !== rowId ? r : normalizeRow({ ...r, ...patch })));
      }

      function mergeAddIntoRisk(rowId, event) {
        if (event) event.stopPropagation();
        flushTradeInputsFromDom(rowId);
        const raw = state.rows.find((r) => r.id === rowId);
        if (!raw) return;
        const row = normalizeRow(raw);
        const m = calc(row);
        const ac = n(row.addCount);
        const ap = n(row.addPrice);
        const asa = n(row.addStopAmount);
        if (ac === null || ac <= 0) {
          alert("请填写大于 0 的加仓数");
          return;
        }
        if (ap === null || asa === null) {
          alert("请填写加仓价格与止损额");
          return;
        }
        if (m.addStopPrice === null) {
          alert("无法计算加仓止损价位，请检查输入");
          return;
        }
        const oldPos = n(row.position);
        const oldCost = n(row.costPrice);
        const oldPp = n(row.plannedPosition);
        const posBase = Math.max(0, oldPos !== null ? oldPos : 0);
        const newPos = posBase + ac;
        let newCost;
        if (posBase <= 0 || oldCost === null) newCost = ap;
        else newCost = (oldCost * posBase + ap * ac) / newPos;
        const nextPlanned = oldPp === null || oldPp === 0 ? newPos : oldPp + ac;
        const prevHist = Array.isArray(raw.addHistory) ? raw.addHistory.map(normalizeAddHistEntry) : [];
        prevHist.push(
          normalizeAddHistEntry({
            addPrice: ap.toFixed(2),
            addCount: formatPositionStored(ac),
            addStopAmount: asa.toFixed(2),
            currentPriceAtMerge: row.currentPrice || ""
          })
        );
        state.rows = state.rows.map((r) =>
          r.id !== rowId
            ? r
            : normalizeRow({
                ...r,
                currentPrice: ap.toFixed(2),
                costPrice: newCost.toFixed(2),
                plannedPosition: formatPositionStored(nextPlanned),
                position: formatPositionStored(newPos),
                stopLossAmount: asa.toFixed(2),
                addCount: "",
                addPrice: "",
                addStopAmount: "",
                addHistory: prevHist
              })
        );
        openRows.delete(rowId);
        openTrades.delete(rowId);
        render();
      }

      function calcTotals() {
        let market = 0;
        let pnl = 0;
        let dayPnl = 0;
        state.rows.forEach((rawRow) => {
          const row = normalizeRow(rawRow);
          const m = calc(row);
          const mvTotal = calcRowMarketTotal(rawRow);
          if (mvTotal !== null) market += mvTotal;
          if (m.pnl !== null) pnl += m.pnl;
          if (m.dayPnl !== null) dayPnl += m.dayPnl;
        });
        return { market, pnl, dayPnl };
      }

      function pnlClassOf(v) {
        return v === null || v === 0 ? "" : v > 0 ? "red" : "green";
      }

      function renderGlobal() {
        const total = calcTotalAssets();
        state.globalHeader.totalAssets = total.toFixed(1);
        const principal = n(state.globalHeader.costCapital) || 0;
        const debt = n(state.globalHeader.debtAmount) || 0;
        const currentProfit = total - principal - debt;
        state.globalHeader.currentProfit = currentProfit.toFixed(1);
        document.getElementById("totalAssets").textContent = FMT1.format(total);
        document.getElementById("currentProfit").textContent = FMT1.format(currentProfit);
        globalKeys.forEach((key) => {
          const input = document.getElementById(key);
          if (document.activeElement !== input) input.value = state.globalHeader[key] || "";
        });
        const target = n(state.globalHeader.targetProfit);
        const rate = !target ? 0 : (currentProfit / target) * 100;
        const progress = rate.toFixed(1) + "%";
        document.getElementById("progress").textContent = progress;
        document.getElementById("progressCopy").textContent = progress;
        document.getElementById("progressRing").style.setProperty("--progress", Math.max(0, Math.min(rate, 100)) * 3.6 + "deg");
        document.getElementById("updatedAt").textContent = state.updatedAt || "--";

        const totals = calcTotals();
        const marketEl = document.getElementById("marketValueTotal");
        if (marketEl) marketEl.textContent = FMT1.format(totals.market);
        const statMarket = document.getElementById("statMarket");
        if (statMarket) statMarket.textContent = FMT1.format(totals.market);
        const statPnl = document.getElementById("statPnl");
        if (statPnl) {
          statPnl.textContent = signed(totals.pnl);
          statPnl.className = `mono ${pnlClassOf(totals.pnl)}`;
        }
        const statDay = document.getElementById("statDayPnl");
        if (statDay) {
          statDay.textContent = signed(totals.dayPnl);
          statDay.className = `mono ${pnlClassOf(totals.dayPnl)}`;
        }
      }

      function renderRows() {
        const box = document.getElementById("rows");
        let hasRisk = false;
        const body = state.rows.map((rawRow) => {
          const row = normalizeRow(rawRow);
          const m = calc(row);
          if (m.breach) hasRisk = true;
          const open = openRows.has(row.id);
          const tradeOpen = openTrades.has(row.id);
          const pnlClass = pnlClassOf(m.pnl);
          const statusClass = m.breach ? "risk" : m.over ? "over" : "normal";
          const tradeStatus = tradePanelStatus(row, m);
          const rowMarketTotal = calcRowMarketTotal(rawRow);
          const blockClass = m.breach ? "risk" : m.over ? "over" : "";
          const testRow2Html = `
            <div class="pos-extra test2" data-test-row2="${row.id}">
                ${htmlTestRow2Main(rawRow, m, tradeStatus)}
            </div>`;
          const histHtml = (row.addHistory || [])
            .map((h, idx) => {
              const hm = calcHistLeg(h);
              const hp = idx + 1;
              const hPnlClass = pnlClassOf(hm.pnl);
              return `
            <div class="pos-extra hist">
              <div class="pos-cell">
                <span class="tag">加仓${hp}</span>
              </div>
              <div class="pos-cell num">
                <strong>${money(hm.displayCp)}</strong>
                <small>${money(hm.displayCost)}</small>
              </div>
              <div class="pos-cell num">
                <strong>${money(hm.marketValue)}</strong>
                <small>${shareLabel(hm.position)}</small>
              </div>
              <div class="pos-cell num">
                <strong class="${hPnlClass}">${money(hm.pnl)}</strong>
                <small>${money(hm.addStopPrice)}</small>
              </div>
            </div>`;
            })
            .join("");
          return `
          <div class="pos-block ${blockClass}">
            <article class="card position-card ${m.breach ? "risk" : ""} ${open ? "open" : ""} ${tradeOpen ? "trade" : ""}">
              <div class="pos-row">
                <div class="pos-cell">
                  <input class="code-input tab-field" data-row-id="${row.id}" data-field="symbol" value="${escapeHtml(row.symbol)}" placeholder="代码" oninput="setRowValue('${row.id}', 'symbol', this.value)" onblur="finishRowEdit()" />
                  <span class="status-chip-mini ${statusClass}">${m.alert}</span>
                </div>
                <div class="pos-cell num">
                  <strong>${money(n(row.currentPrice))}</strong>
                  <small>${money(n(row.costPrice))}</small>
                </div>
                <div class="pos-cell num" data-main-market="${row.id}">
                  <strong>${money(rowMarketTotal)}</strong>
                  <small>${shareLabel(n(row.position))}</small>
                </div>
                <div class="pos-cell num">
                  <strong class="${pnlClass}">${money(m.pnl)}</strong>
                  <small data-main-add-stop="${row.id}"><strong>${money(m.addStopPrice)}</strong></small>
                </div>
              </div>
              <div class="pos-actions">
                <button class="action-chip quote" type="button" data-quote-btn="${row.id}" onclick="fetchQuote('${row.id}', event)">刷新价</button>
                <button class="action-chip primary" type="button" onclick="toggleTrade('${row.id}', event)">${tradeOpen ? "收起加仓" : "加仓"}</button>
                <button class="action-chip warn" type="button" onclick="toggleRow('${row.id}'); event.stopPropagation()">${open ? "收起风控" : "风控"}</button>
                <button class="action-chip danger" type="button" onclick="deleteRow('${row.id}', event)">删</button>
              </div>
              ${testRow2Html}
              <div class="detail">
                <div class="risk-intro">
                  <h3>风控 · 头寸录入</h3>
                </div>
                <div class="metrics" style="margin-top: 0">
                  <h3>头寸（主表数据源）</h3>
                  <div class="grid">
                    ${input(row, "currentPrice", "现价")}
                    ${input(row, "costPrice", "成本")}
                    ${input(row, "plannedPosition", "预计持仓")}
                    ${input(row, "position", "持仓数量")}
                  </div>
                </div>
                <div class="metrics">
                  <h3>止损与当日</h3>
                  <div class="grid">
                    ${input(row, "dayPnl", "当日盈亏")}
                    ${input(row, "stopLossAmount", "计划止损额")}
                  </div>
                </div>
                <div class="metrics">
                  <h3>持仓状态雷达</h3>
                  <div class="metric-grid mono">
                    ${metric("预仓转换成本价", money(m.equiv))}
                    ${metric("恢复涨幅", pct(m.recovery), m.recovery !== null ? "purple" : "")}
                    ${metric("止损价", money(m.stop), m.breach ? "red" : "")}
                    ${metric("离场空间", pct(m.distance), m.breach ? "red" : "")}
                  </div>
                </div>
                <div class="confirm-row">
                  <button ${actionBtn(`confirmRisk('${row.id}', event)`)}>确认</button>
                  <span class="sub">写入主表并收起风控</span>
                </div>
              </div>
              <div class="trade-detail">
                <div class="trade-panel" data-add-panel="${row.id}">
                  <div class="drawer-head">
                    <div>
                      <p class="drawer-title">加仓</p>
                    </div>
                    <span class="status-chip ${tradeStatus.className}" data-add-status="${row.id}">${tradeStatus.text}</span>
                  </div>
                  <div class="grid">
                    ${input(row, "addPrice", "加仓价格", "0.00", true)}
                    ${input(row, "addCount", "加仓数", "0.00", true)}
                    ${input(row, "addStopAmount", "止损额", row.stopLossAmount || "0.00", true)}
                  </div>
                  <div class="rr-line mono">
                    <div class="rr-box"><small>止损价位</small><strong data-add-stop-price="${row.id}">${money(m.addStopPrice)}</strong></div>
                    <div class="rr-box"><small>计算式</small><strong>(加价×加仓数−止损额)÷加仓数</strong></div>
                  </div>
                  <div class="merge-row">
                    <button ${actionBtn(`mergeAddIntoRisk('${row.id}', event)`)}>合并到头寸</button>
                  </div>
                </div>
              </div>
            </article>${histHtml}
          </div>`;
        }).join("");
        box.innerHTML = body;
        updateRiskPulse(hasRisk);
      }

      function input(row, key, label, placeholder = "0.00", syncAdd = false) {
        const oninput = syncAdd
          ? `setRowValue('${row.id}', '${key}', this.value); syncAddPreview('${row.id}');`
          : `setRowValue('${row.id}', '${key}', this.value)`;
        return `<div class="field"><label>${label}</label><input class="mono tab-field" data-row-id="${row.id}" data-field="${key}" type="number" inputmode="decimal" value="${escapeHtml(row[key])}" placeholder="${escapeHtml(placeholder)}" oninput="${oninput}" onblur="finishRowEdit()" /></div>`;
      }

      function summary(label, value, className = "") {
        return `<div><small>${label}</small><strong class="${className}">${value}</strong></div>`;
      }

      function dataCell(label, value, className = "") {
        return `<div class="data-cell mono"><small>${label}</small><strong class="${className}">${value}</strong></div>`;
      }

      function dataCellNamed(label, value, className = "") {
        return `<div class="data-cell mono data-cell-named"><small>${label}</small><strong class="${className}">${value}</strong></div>`;
      }

      function metric(label, value, className = "") {
        return `<div class="metric"><span>${label}</span><strong class="${className}">${value}</strong></div>`;
      }

      function updateRiskPulse(hasRisk) {
        document.getElementById("topAlert").classList.toggle("on", hasRisk);
        if (hasRisk && !lastRiskPulse && navigator.vibrate) navigator.vibrate([45, 70, 45]);
        lastRiskPulse = hasRisk;
      }

      function tradePanelStatus(row, m) {
        const ac = n(row.addCount);
        if (ac === 0 || ac < 0) return { text: "加仓数无效", className: "bad" };
        if (m.addStopPrice === null) return { text: "待输入", className: "" };
        return { text: "已生成", className: "ok" };
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[char]);
      }

      function render() {
        state.rows = state.rows.map(normalizeRow);
        renderGlobal();
        renderRows();
      }

      function saveLocal() {
        state.updatedAt = new Date().toLocaleString("zh-CN", { hour12: false });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        renderGlobal();
        alert("已保存到浏览器本地存储");
      }

      function exportJson() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "postiton-ol-data.json";
        a.click();
        URL.revokeObjectURL(url);
      }

      function resetAll() {
        if (!confirm("确定要清空当前页面数据吗？")) return;
        state = { globalHeader: defaultGlobalHeader(), rows: Array.from({ length: 4 }, emptyRow), updatedAt: "--" };
        openRows.clear();
        openTrades.clear();
        render();
      }

      globalKeys.forEach((key) => {
        document.addEventListener("input", (event) => {
          if (event.target && event.target.id === key) {
            state.globalHeader[key] = event.target.value;
            renderGlobal();
          }
        });
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Tab") return;
        const active = document.activeElement;
        if (!active || active.tagName !== "INPUT") return;
        if (!getTabInputs().includes(active)) return;
        event.preventDefault();
        focusTabRelative(event.shiftKey);
      });

      document.getElementById("importFile").addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        state = JSON.parse(await file.text());
        state.globalHeader = normalizeGlobalHeader(state.globalHeader);
        event.target.value = "";
        render();
      });

      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          state = JSON.parse(saved);
          state.globalHeader = normalizeGlobalHeader(state.globalHeader);
          state.rows = (state.rows || []).map(normalizeRow);
        } catch {
          state.globalHeader = defaultGlobalHeader();
          state.rows = Array.from({ length: 4 }, emptyRow);
        }
      } else {
        state.rows = Array.from({ length: 4 }, emptyRow);
      }
      render();
    </script>
  </body>
</html>
