<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>POSTITON OL</title>
    <style>
      :root {
        color-scheme: dark;
        --root: #07070b;
        --surface: rgba(255, 255, 255, 0.055);
        --surface-strong: rgba(255, 255, 255, 0.09);
        --text: #f7f7fb;
        --muted: #8e8e99;
        --dim: #575763;
        --blue: #0a84ff;
        --cyan: #18f2ff;
        --purple: #bf5af2;
        --red: #ff453a;
        --green: #32d74b;
        --amber: #ff9f0a;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        background: var(--root);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      input,
      button {
        font: inherit;
      }

      input {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
      }

      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        margin: 0;
        -webkit-appearance: none;
      }

      .mono {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      .app {
        min-height: 100dvh;
        max-width: 430px;
        margin: 0 auto;
        padding-bottom: calc(108px + env(safe-area-inset-bottom));
        background:
          linear-gradient(#06050a 0 118px, transparent 118px),
          radial-gradient(circle at 84% 18%, rgba(191, 90, 242, 0.34), transparent 34%),
          radial-gradient(circle at 4% 25%, rgba(24, 242, 255, 0.18), transparent 34%),
          var(--root);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      }

      header {
        position: sticky;
        top: 0;
        z-index: 6;
        padding: calc(25px + env(safe-area-inset-top)) 18px 18px;
        background: #06050a;
      }

      h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 900;
        letter-spacing: -0.05em;
      }

      .sub {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 15px;
        font-weight: 400;
      }

      .alert-strip {
        display: none;
        margin-top: 12px;
        border-radius: 18px;
        padding: 10px 12px;
        background: rgba(255, 69, 58, 0.2);
        color: #ffd6d3;
        font-size: 12px;
        font-weight: 800;
        box-shadow: 0 0 28px rgba(255, 69, 58, 0.18);
      }

      .alert-strip.on {
        display: block;
        animation: pulseRed 1.05s ease-in-out infinite;
      }

      main {
        padding: 42px 8px 0;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0 4px 12px;
        color: var(--muted);
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      .card {
        overflow: hidden;
        margin-bottom: 12px;
        border-radius: 30px;
        background: var(--surface);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      .global {
        padding: 21px 18px 18px;
        background: rgba(255, 255, 255, 0.058);
      }

      .global-top {
        display: flex;
        gap: 16px;
        justify-content: space-between;
        align-items: center;
      }

      .hero-label {
        color: var(--muted);
        font-size: 15px;
        font-weight: 300;
      }

      .hero-value {
        display: block;
        margin-top: 13px;
        font-size: 44px;
        font-weight: 900;
        letter-spacing: -0.06em;
      }

      .progress-ring {
        --progress: 0deg;
        position: relative;
        display: grid;
        width: 94px;
        height: 94px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 50%;
        background: conic-gradient(from -90deg, var(--purple) 0deg, var(--cyan) var(--progress), rgba(255, 255, 255, 0.11) var(--progress), rgba(255, 255, 255, 0.11) 360deg);
      }

      .progress-ring::after {
        position: absolute;
        inset: 8px;
        border-radius: inherit;
        background: #101016;
        content: "";
      }

      .progress-ring strong {
        position: relative;
        z-index: 1;
        font-size: 17px;
        font-weight: 900;
      }

      .capital-grid,
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .capital-grid {
        margin-top: 24px;
      }

      .capital-item,
      .field {
        min-height: 66px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.045);
        padding: 14px 13px;
      }

      .capital-item label,
      .field label {
        display: block;
        margin-bottom: 5px;
        color: var(--muted);
        font-size: 15px;
        font-weight: 300;
      }

      .capital-item input {
        font-size: 22px;
        font-weight: 850;
        letter-spacing: -0.03em;
      }

      .field:focus-within,
      .capital-item:focus-within {
        background: rgba(10, 132, 255, 0.14);
      }

      .position-card {
        position: relative;
        overflow: visible;
        padding-left: 6px;
        min-width: 0;
        margin-bottom: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .position-group {
        margin-bottom: 10px;
      }

      .position-add-history-row-wrap {
        overflow: hidden;
        background: rgba(0, 0, 0, 0.22);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      .position-add-history-row {
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        background: rgba(24, 242, 255, 0.045);
      }

      .position-test-row2-wrap {
        overflow: hidden;
        background: rgba(0, 0, 0, 0.18);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .position-test-row2 {
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        background: rgba(191, 90, 242, 0.06);
      }

      .test2-tag {
        background: rgba(191, 90, 242, 0.18);
        color: var(--purple);
      }

      .stock-cell-history .test2-sub {
        display: block;
        margin-top: 2px;
        font-size: 6px;
        line-height: 1.2;
        text-align: center;
        opacity: 0.85;
      }

      .stock-cell-history {
        align-items: center;
        justify-content: center;
      }

      .history-tag {
        display: inline-block;
        padding: 2px 5px;
        border-radius: 999px;
        background: rgba(24, 242, 255, 0.12);
        color: var(--cyan);
        font-size: 7px;
        font-weight: 850;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      .position-card::before {
        position: absolute;
        top: 8px;
        bottom: 8px;
        left: 2px;
        width: 3px;
        border-radius: 999px;
        background: var(--green);
        box-shadow: 0 0 10px rgba(50, 215, 75, 0.45);
        content: "";
      }

      .position-card.risk::before {
        background: var(--red);
        box-shadow: 0 0 12px rgba(255, 69, 58, 0.75);
        animation: pulseRed 0.86s ease-in-out infinite;
      }

      .position-main {
        display: grid;
        grid-template-columns:
          minmax(0, 1.5fr)
          minmax(0, 0.78fr)
          minmax(0, 0.7fr)
          minmax(0, 0.7fr)
          minmax(0, 0.82fr)
          minmax(0, 0.76fr)
          minmax(0, 0.72fr)
          minmax(0, 0.76fr)
          minmax(0, 0.62fr);
        gap: 0;
        align-items: stretch;
        width: 100%;
        min-width: 0;
        min-height: 34px;
        padding: 2px 4px 2px 10px;
        color: inherit;
        background: transparent;
      }

      .monitor-scroll {
        position: relative;
        overflow-x: visible;
        padding-bottom: 4px;
        margin: 0;
      }

      .monitor-table {
        min-width: 0;
        width: 100%;
        overflow: visible;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.04);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .table-head {
        display: grid;
        grid-template-columns:
          minmax(0, 1.5fr)
          minmax(0, 0.78fr)
          minmax(0, 0.7fr)
          minmax(0, 0.7fr)
          minmax(0, 0.82fr)
          minmax(0, 0.76fr)
          minmax(0, 0.72fr)
          minmax(0, 0.76fr)
          minmax(0, 0.62fr);
        min-width: 0;
        width: 100%;
        margin: 0;
        padding: 0 4px 3px 10px;
        color: var(--muted);
        font-size: 8px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .table-head span,
      .stock-cell,
      .data-cell {
        padding: 0 2px;
      }

      .stock-cell {
        display: flex;
        flex-direction: column;
        gap: 2px;
        justify-content: center;
        min-width: 0;
      }

      .stock-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
      }

      .stock-actions .pill {
        min-height: 14px;
        padding: 2px 4px;
        font-size: 7px;
      }

      .stock-cell .stock-code-input {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .data-cell {
        display: flex;
        min-width: 0;
        flex-direction: column;
        justify-content: center;
      }

      .data-cell small {
        display: none;
      }

      .data-cell-named small {
        display: block;
        margin-bottom: 2px;
        color: var(--muted);
        font-size: 6px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .data-cell strong,
      .data-cell input {
        overflow: hidden;
        font-size: 7px;
        font-weight: 750;
        letter-spacing: -0.03em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .badge {
        border-radius: 4px;
        min-width: 0;
        width: 100%;
        padding: 2px 3px;
        background: rgba(50, 215, 75, 0.18);
        color: var(--green);
        font-size: 7px;
        font-weight: 800;
        text-align: center;
        white-space: nowrap;
      }

      .badge.red {
        background: rgba(255, 69, 58, 0.18);
        color: #ffb4ae;
        animation: pulseRed 0.86s ease-in-out infinite;
      }

      .badge.amber {
        background: rgba(255, 159, 10, 0.16);
        color: var(--amber);
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px 8px;
        margin-top: 14px;
      }

      .summary small,
      .metric span:first-child {
        display: block;
        color: var(--muted);
        font-size: 10px;
        font-weight: 300;
      }

      .summary strong {
        display: block;
        overflow: hidden;
        margin-top: 3px;
        font-size: 14px;
        font-weight: 850;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .pill {
        border: 0;
        border-radius: 999px;
        min-height: 24px;
        padding: 4px 7px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
        font-size: 10px;
        font-weight: 850;
        line-height: 1;
      }

      .pill.blue {
        color: var(--cyan);
        background: rgba(24, 242, 255, 0.1);
      }

      .pill.red {
        color: #ffb4ae;
        background: rgba(255, 69, 58, 0.13);
      }

      .detail {
        display: none;
        padding: 0 14px 15px;
      }

      .detail .risk-intro {
        margin-bottom: 12px;
      }

      .detail .risk-intro h3 {
        margin: 0 0 6px;
        color: var(--text);
        font-size: 13px;
        font-weight: 900;
      }

      .detail .risk-intro .sub {
        margin: 0;
        font-size: 11px;
      }

      .open .detail {
        display: block;
      }

      .trade-detail {
        display: none;
        padding: 0 14px 15px;
      }

      .trade .trade-detail {
        display: block;
      }

      .metrics {
        margin-top: 10px;
        border-radius: 22px;
        background: rgba(0, 0, 0, 0.18);
        padding: 13px;
      }

      .trade-panel {
        margin-top: 10px;
        border-radius: 24px;
        background: rgba(24, 242, 255, 0.07);
        padding: 13px;
      }

      .trade-panel.locked {
        background: rgba(92, 18, 18, 0.7);
      }

      .trade-panel .merge-row {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .trade-panel .merge-row .pill {
        min-height: 28px;
        padding: 4px 10px;
        font-size: 11px;
      }

      .detail .confirm-row {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .detail .confirm-row .pill {
        min-height: 28px;
        padding: 4px 10px;
        font-size: 11px;
      }

      .metrics h3 {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.06em;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 14px;
        font-size: 13px;
      }

      .metric strong {
        display: block;
        margin-top: 3px;
        font-weight: 850;
      }

      .bottom {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 7;
        max-width: 430px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
        background: rgba(7, 7, 11, 0.74);
        backdrop-filter: blur(24px);
      }

      .action,
      .link {
        border: 0;
        color: var(--blue);
        background: transparent;
        font-weight: 850;
      }

      .action {
        min-height: 52px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.075);
        font-size: 12px;
      }

      .drawer-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .drawer-title {
        margin: 0;
        font-size: 18px;
        font-weight: 900;
      }

      .status-chip {
        border-radius: 999px;
        padding: 6px 10px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.08);
        font-size: 12px;
        font-weight: 900;
      }

      .status-chip.ok {
        color: var(--green);
        background: rgba(50, 215, 75, 0.13);
      }

      .status-chip.bad {
        color: #ffd6d3;
        background: rgba(255, 69, 58, 0.22);
      }

      .rr-line {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-top: 12px;
      }

      .rr-box {
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.07);
        padding: 11px;
      }

      .rr-box small {
        display: block;
        color: var(--muted);
        font-size: 10px;
      }

      .rr-box strong {
        display: block;
        margin-top: 4px;
        font-size: 16px;
        font-weight: 900;
      }

      .red {
        color: var(--red);
      }

      .green {
        color: var(--green);
      }

      .amber {
        color: var(--amber);
      }

      .purple {
        color: var(--purple);
      }

      @keyframes pulseRed {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.56;
        }
      }

    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>POSTITON OL</h1>
        <p class="sub">交易员个人操作分析驾驶舱 · HTML 主页版</p>
        <div class="alert-strip" id="topAlert">风险脉冲：有持仓逼近或跌破止损线，请立即处理。</div>
      </header>

      <main>
        <section>
          <div class="section-head">
            <span>GLOBAL HEADER</span>
            <strong class="green">资金安全视图</strong>
          </div>
          <div class="card global">
            <div class="global-top">
              <div>
                <span class="hero-label">总市值</span>
                <input class="hero-value mono" id="totalAssets" type="number" inputmode="decimal" placeholder="0.00" readonly />
                <p class="sub">最近保存：<span id="updatedAt">--</span></p>
              </div>
              <div class="progress-ring" id="progressRing">
                <strong id="progress">0.00%</strong>
              </div>
            </div>
            <div class="capital-grid">
              <div class="capital-item"><label>本金</label><input id="costCapital" class="mono" type="number" inputmode="decimal" /></div>
              <div class="capital-item"><label>欠款</label><input id="debtAmount" class="mono" type="number" inputmode="decimal" /></div>
              <div class="capital-item"><label>目标盈利</label><input id="targetProfit" class="mono" type="number" inputmode="decimal" /></div>
              <div class="capital-item"><label>当前盈利</label><input id="currentProfit" class="mono" type="number" inputmode="decimal" readonly /></div>
              <div class="capital-item"><label>目标达成率</label><strong class="mono" id="progressCopy">0.00%</strong></div>
            </div>
          </div>
        </section>

        <section>
          <div class="section-head">
            <span>POSITION MONITOR</span>
            <button class="link" onclick="addRow()">+ 新交易</button>
          </div>
          <div id="rows"></div>
        </section>
      </main>

      <input id="importFile" type="file" accept="application/json" hidden />

      <nav class="bottom">
        <button class="action" onclick="saveLocal()">保存</button>
        <button class="action" onclick="exportJson()">导出</button>
        <button class="action" onclick="document.getElementById('importFile').click()">导入</button>
        <button class="action red" onclick="resetAll()">重置</button>
      </nav>
    </div>

    <script>
      const STORAGE_KEY = "postiton_ol_html_state_v1";
      const globalKeys = ["costCapital", "debtAmount", "targetProfit"];
      const openRows = new Set();
      const openTrades = new Set();
      let lastRiskPulse = false;
      let state = {
        globalHeader: defaultGlobalHeader(),
        rows: [],
        updatedAt: "--"
      };

      function defaultGlobalHeader() {
        return { totalAssets: "", costCapital: "", debtAmount: "", targetProfit: "", currentProfit: "" };
      }

      function normalizeGlobalHeader(globalHeader = {}) {
        return { ...defaultGlobalHeader(), ...globalHeader };
      }

      function id() {
        return Math.random().toString(36).slice(2, 11);
      }

      function emptyRow() {
        return normalizeRow({ id: id() });
      }

      function shareLabel(value) {
        if (value === null) return "--";
        const v = Math.round(value * 100) / 100;
        return Number.isInteger(v) ? String(v) : v.toFixed(2);
      }

      function normalizeAddHistEntry(h) {
        return {
          addPrice: h.addPrice || "",
          addCount: h.addCount || "",
          addStopAmount: h.addStopAmount || "",
          currentPriceAtMerge: h.currentPriceAtMerge || ""
        };
      }

      function normalizeRow(row) {
        return {
          id: row.id || id(),
          symbol: row.symbol || row.name || "",
          name: "",
          position: row.position || "",
          plannedPosition: row.plannedPosition || "",
          currentPrice: row.currentPrice || "",
          costPrice: row.costPrice || "",
          dayPnl: row.dayPnl || "",
          stopLossAmount: row.stopLossAmount || "",
          execBuyPrice: row.execBuyPrice || "",
          execDayPosition: row.execDayPosition || "",
          execStopAmount: row.execStopAmount || "",
          execStopPrice: row.execStopPrice || "",
          rrRatio: row.rrRatio || "2",
          addCount: row.addCount || "",
          addPrice: row.addPrice || "",
          addStopAmount: row.addStopAmount || "",
          addHistory: Array.isArray(row.addHistory) ? row.addHistory.map(normalizeAddHistEntry) : []
        };
      }

      function n(value) {
        const text = String(value ?? "").trim();
        if (!text) return null;
        const parsed = Number(text);
        return Number.isFinite(parsed) ? parsed : null;
      }

      function money(value) {
        return value === null ? "--" : value.toFixed(2);
      }

      function qty(value) {
        return value === null ? "--" : Math.floor(value).toString();
      }

      function pct(value) {
        return value === null ? "--" : value.toFixed(2) + "%";
      }

      function calc(row) {
        const cp = n(row.currentPrice);
        const cost = n(row.costPrice);
        const pos = n(row.position);
        const ppos = n(row.plannedPosition);
        const slimit = n(row.stopLossAmount);
        const explicitStop = n(row.execStopPrice);
        const total = cp === null || pos === null ? null : cp * pos;
        const marketValue = cost === null || pos === null ? null : cost * pos;
        let equiv = null;
        if (ppos !== null && ppos !== 0 && pos !== null) {
          if (pos >= ppos && total !== null) equiv = total / ppos;
          else if (cost !== null) equiv = cost;
        }
        const pnl = cp === null || cost === null || pos === null ? null : (cp - cost) * pos;
        const dayPnl = n(row.dayPnl);
        const recovery = cp === null || cp === 0 || cost === null || cp >= cost ? null : ((cost - cp) / cp) * 100;
        const derivedStop = cost === null || slimit === null || pos === null || pos === 0 ? null : cost - slimit / pos;
        const stop = explicitStop !== null ? explicitStop : derivedStop;
        const distance = cp === null || cp === 0 || stop === null ? null : ((cp - stop) / cp) * 100;
        const over = ppos !== null && ppos !== 0 && pos !== null && pos / ppos > 1;
        const breach = distance !== null && distance < 2;
        const actualLoss = pnl === null || pnl > 0 ? 0 : Math.abs(pnl);
        const addCount = n(row.addCount);
        const addPrice = n(row.addPrice);
        const addStopAmount = n(row.addStopAmount);
        const addStopPrice = addCount === null || addCount === 0 || addPrice === null || addStopAmount === null ? null : (addCount * addPrice - addStopAmount) / addCount;
        return {
          total,
          marketValue,
          equiv,
          pnl,
          dayPnl,
          recovery,
          stop,
          distance,
          alert: breach ? "异常" : over ? "超预仓" : "正常",
          breach,
          over,
          actualLoss,
          addStopPrice
        };
      }

      function calcHistLeg(h) {
        const entry = normalizeAddHistEntry(h);
        const ap = n(entry.addPrice);
        const ac = n(entry.addCount);
        const asa = n(entry.addStopAmount);
        const cpSnap = n(entry.currentPriceAtMerge);
        const marketValue = ap !== null && ac !== null ? ap * ac : null;
        const addStopPrice =
          ac === null || ac === 0 || ap === null || asa === null ? null : (ac * ap - asa) / ac;
        const pnl = cpSnap !== null && ap !== null && ac !== null ? (cpSnap - ap) * ac : null;
        return {
          marketValue,
          addStopPrice,
          pnl,
          displayCp: cpSnap,
          displayCost: ap,
          planned: ac,
          position: ac
        };
      }

      function calcAddPreviewMarket(row) {
        const ap = n(row.addPrice);
        const ac = n(row.addCount);
        return ap !== null && ac !== null ? ap * ac : null;
      }

      function calcAddTotals(rawRow) {
        const row = normalizeRow(rawRow);
        let totalCount = 0;
        let totalAmount = 0;
        let totalStopAmount = 0;
        let hasCount = false;
        let hasAmount = false;
        let hasStop = false;

        function addLeg(price, count, stopAmt) {
          const ac = n(count);
          const ap = n(price);
          const asa = n(stopAmt);
          if (ac !== null) {
            totalCount += ac;
            hasCount = true;
          }
          if (ap !== null && ac !== null) {
            totalAmount += ap * ac;
            hasAmount = true;
          }
          if (asa !== null) {
            totalStopAmount += asa;
            hasStop = true;
          }
        }

        addLeg(row.addPrice, row.addCount, row.addStopAmount);
        (row.addHistory || []).forEach((h) => {
          const e = normalizeAddHistEntry(h);
          addLeg(e.addPrice, e.addCount, e.addStopAmount);
        });

        return {
          totalCount: hasCount ? totalCount : null,
          totalAmount: hasAmount ? totalAmount : null,
          totalStopAmount: hasStop ? totalStopAmount : null
        };
      }

      function calcRowMarketTotal(rawRow) {
        const row = normalizeRow(rawRow);
        const base = calc(row).marketValue;
        const add = calcAddPreviewMarket(row);
        if (base === null && add === null) return null;
        return (base || 0) + (add || 0);
      }

      function calcTotalAssets() {
        return state.rows.reduce((sum, rawRow) => {
          const total = calcRowMarketTotal(rawRow);
          return total === null ? sum : sum + total;
        }, 0);
      }

      function setRowValue(rowId, key, value, shouldRender = false) {
        state.rows = state.rows.map((row) => (row.id === rowId ? normalizeRow({ ...row, [key]: value }) : row));
        if (shouldRender) render();
      }

      let tabNavigating = false;

      function getTabInputs() {
        const root = document.querySelector(".app");
        if (!root) return [];
        return Array.from(root.querySelectorAll('input:not([readonly]):not([type="file"]):not([hidden])')).filter((el) => {
          if (el.offsetParent === null) return false;
          const card = el.closest(".position-card");
          if (!card) return true;
          if (el.closest(".detail") && !card.classList.contains("open")) return false;
          if (el.closest(".trade-detail") && !card.classList.contains("trade")) return false;
          return true;
        });
      }

      function refocusInput(meta) {
        if (!meta) return;
        let el = null;
        if (meta.id) el = document.getElementById(meta.id);
        else if (meta.rowId && meta.field) {
          el = document.querySelector(`input[data-row-id="${meta.rowId}"][data-field="${meta.field}"]`);
        }
        if (!el) return;
        el.focus();
        const pos = Math.min(meta.caret ?? el.value.length, String(el.value).length);
        try {
          el.setSelectionRange(pos, pos);
        } catch (_) {
          /* number inputs may not support selection in some browsers */
        }
      }

      function focusTabRelative(shift) {
        const inputs = getTabInputs();
        const current = document.activeElement;
        const idx = inputs.indexOf(current);
        if (idx === -1) return;
        const nextIdx = shift ? idx - 1 : idx + 1;
        if (nextIdx < 0 || nextIdx >= inputs.length) return;
        const target = inputs[nextIdx];
        const meta = {
          id: target.id || "",
          rowId: target.dataset.rowId || "",
          field: target.dataset.field || ""
        };
        tabNavigating = true;
        renderRows();
        renderGlobal();
        tabNavigating = false;
        refocusInput(meta);
      }

      function htmlTestRow2Main(rawRow, m, tradeStatus) {
        const row = normalizeRow(rawRow);
        const t = calcAddTotals(rawRow);
        const pendingCount = n(row.addCount);
        const hasPending = calcAddPreviewMarket(row) !== null || pendingCount !== null || m.addStopPrice !== null;
        return `
                <div class="stock-cell stock-cell-history">
                  <span class="history-tag test2-tag">测试行2</span>
                  <small class="sub test2-sub">加仓合计</small>
                </div>
                ${dataCell("市值", money(t.totalAmount))}
                ${dataCell("现价", "--")}
                ${dataCell("成本", money(t.totalStopAmount))}
                ${dataCell("预计持仓", shareLabel(pendingCount))}
                ${dataCell("持仓数量", shareLabel(t.totalCount))}
                ${dataCell("加仓止损", money(m.addStopPrice))}
                ${dataCell("浮动盈亏", "--")}
                <div class="data-cell"><span class="status-chip ${hasPending ? tradeStatus.className : "idle"}">${hasPending ? tradeStatus.text : "合计"}</span></div>`;
      }

      function syncAddPreview(rowId) {
        const raw = state.rows.find((r) => r.id === rowId);
        if (!raw) return;
        const row = normalizeRow(raw);
        const m = calc(row);
        const tradeStatus = tradePanelStatus(row, m);
        const wrap = document.querySelector(`[data-test-row2="${rowId}"]`);
        if (wrap) {
          wrap.innerHTML = `<div class="position-main position-test-row2">${htmlTestRow2Main(row, m, tradeStatus)}</div>`;
        }
        const panel = document.querySelector(`[data-add-panel="${rowId}"]`);
        if (panel) {
          const stopEl = panel.querySelector("[data-add-stop-price]");
          if (stopEl) stopEl.textContent = money(m.addStopPrice);
          const chip = panel.querySelector("[data-add-status]");
          if (chip) {
            chip.textContent = tradeStatus.text;
            chip.className = `status-chip ${tradeStatus.className}`;
          }
        }
        const metricStop = document.querySelector(`[data-add-metric-stop="${rowId}"]`);
        if (metricStop) metricStop.textContent = money(m.addStopPrice);
        const mainStop = document.querySelector(`[data-main-add-stop="${rowId}"] strong`);
        if (mainStop) mainStop.textContent = money(m.addStopPrice);
        const mainMv = document.querySelector(`[data-main-market="${rowId}"] strong`);
        if (mainMv) mainMv.textContent = money(calcRowMarketTotal(raw));
        renderGlobal();
      }

      let finishRowEditTimer = null;

      function finishRowEdit() {
        if (tabNavigating) return;
        clearTimeout(finishRowEditTimer);
        finishRowEditTimer = setTimeout(() => {
          const active = document.activeElement;
          if (active && active.closest(".confirm-row, .merge-row, .stock-actions")) return;
          renderRows();
          renderGlobal();
        }, 0);
      }

      function actionBtn(handler) {
        return `type="button" class="pill blue action-btn" onmousedown="${handler}; event.preventDefault(); event.stopPropagation()"`;
      }

      function addRow() {
        const row = emptyRow();
        state.rows.push(row);
        openRows.add(row.id);
        openTrades.add(row.id);
        render();
      }

      function toggleRow(rowId) {
        if (openRows.has(rowId)) openRows.delete(rowId);
        else openRows.add(rowId);
        renderRows();
      }

      function toggleTrade(rowId, event) {
        if (event) event.stopPropagation();
        if (openTrades.has(rowId)) openTrades.delete(rowId);
        else openTrades.add(rowId);
        renderRows();
      }

      function deleteRow(rowId, event) {
        if (event) event.stopPropagation();
        const row = state.rows.find((item) => item.id === rowId);
        const label = row && row.symbol ? `「${row.symbol}」` : "这条持仓";
        if (!confirm(`确定删除${label}吗？`)) return;
        state.rows = state.rows.filter((item) => item.id !== rowId);
        openRows.delete(rowId);
        openTrades.delete(rowId);
        renderRows();
        renderGlobal();
      }

      function formatPositionStored(value) {
        if (value === null || Number.isNaN(value)) return "";
        if (Math.abs(value % 1) < 1e-9) return String(Math.round(value));
        return value.toFixed(2);
      }

      const riskFieldKeys = ["currentPrice", "costPrice", "plannedPosition", "position", "dayPnl", "stopLossAmount"];

      function formatRiskStored(key, raw) {
        const v = n(raw);
        if (v === null) return "";
        if (key === "plannedPosition" || key === "position") return formatPositionStored(v);
        return v.toFixed(2);
      }

      function confirmRisk(rowId, event) {
        if (event) event.stopPropagation();
        const patch = {};
        document.querySelectorAll(`input[data-row-id="${rowId}"][data-field]`).forEach((el) => {
          if (!el.closest(".detail")) return;
          const key = el.dataset.field;
          if (!riskFieldKeys.includes(key)) return;
          patch[key] = el.value;
        });
        state.rows = state.rows.map((r) => {
          if (r.id !== rowId) return r;
          const merged = normalizeRow({ ...r, ...patch });
          const formatted = {};
          riskFieldKeys.forEach((key) => {
            formatted[key] = formatRiskStored(key, merged[key]);
          });
          return normalizeRow({ ...merged, ...formatted });
        });
        openRows.delete(rowId);
        render();
      }

      function flushTradeInputsFromDom(rowId) {
        const addKeys = ["addPrice", "addCount", "addStopAmount"];
        const patch = {};
        document.querySelectorAll(`input[data-row-id="${rowId}"][data-field]`).forEach((el) => {
          if (!el.closest(".trade-detail")) return;
          const key = el.dataset.field;
          if (addKeys.includes(key)) patch[key] = el.value;
        });
        if (!Object.keys(patch).length) return;
        state.rows = state.rows.map((r) => (r.id !== rowId ? r : normalizeRow({ ...r, ...patch })));
      }

      function mergeAddIntoRisk(rowId, event) {
        if (event) event.stopPropagation();
        flushTradeInputsFromDom(rowId);
        const raw = state.rows.find((r) => r.id === rowId);
        if (!raw) return;
        const row = normalizeRow(raw);
        const m = calc(row);
        const ac = n(row.addCount);
        const ap = n(row.addPrice);
        const asa = n(row.addStopAmount);
        if (ac === null || ac <= 0) {
          alert("请填写大于 0 的加仓数");
          return;
        }
        if (ap === null || asa === null) {
          alert("请填写加仓价格与止损额");
          return;
        }
        if (m.addStopPrice === null) {
          alert("无法计算加仓止损价位，请检查输入");
          return;
        }
        const oldPos = n(row.position);
        const oldCost = n(row.costPrice);
        const oldPp = n(row.plannedPosition);
        const posBase = Math.max(0, oldPos !== null ? oldPos : 0);
        const newPos = posBase + ac;
        let newCost;
        if (posBase <= 0 || oldCost === null) newCost = ap;
        else newCost = (oldCost * posBase + ap * ac) / newPos;
        const nextPlanned = oldPp === null || oldPp === 0 ? newPos : oldPp + ac;
        const prevHist = Array.isArray(raw.addHistory) ? raw.addHistory.map(normalizeAddHistEntry) : [];
        prevHist.push(
          normalizeAddHistEntry({
            addPrice: ap.toFixed(2),
            addCount: formatPositionStored(ac),
            addStopAmount: asa.toFixed(2),
            currentPriceAtMerge: row.currentPrice || ""
          })
        );
        state.rows = state.rows.map((r) =>
          r.id !== rowId
            ? r
            : normalizeRow({
                ...r,
                currentPrice: ap.toFixed(2),
                costPrice: newCost.toFixed(2),
                plannedPosition: formatPositionStored(nextPlanned),
                position: formatPositionStored(newPos),
                stopLossAmount: asa.toFixed(2),
                addCount: "",
                addPrice: "",
                addStopAmount: "",
                addHistory: prevHist
              })
        );
        openRows.delete(rowId);
        openTrades.delete(rowId);
        render();
      }

      function renderGlobal() {
        state.globalHeader.totalAssets = calcTotalAssets().toFixed(2);
        const principal = n(state.globalHeader.costCapital) || 0;
        const debt = n(state.globalHeader.debtAmount) || 0;
        state.globalHeader.currentProfit = (n(state.globalHeader.totalAssets) - principal - debt).toFixed(2);
        const totalAssetsInput = document.getElementById("totalAssets");
        totalAssetsInput.value = state.globalHeader.totalAssets;
        document.getElementById("currentProfit").value = state.globalHeader.currentProfit;
        globalKeys.forEach((key) => {
          const input = document.getElementById(key);
          if (document.activeElement !== input) input.value = state.globalHeader[key] || "";
        });
        const target = n(state.globalHeader.targetProfit);
        const current = n(state.globalHeader.currentProfit);
        const rate = !target || current === null ? 0 : (current / target) * 100;
        const progress = rate.toFixed(2) + "%";
        document.getElementById("progress").textContent = progress;
        document.getElementById("progressCopy").textContent = progress;
        document.getElementById("progressRing").style.setProperty("--progress", Math.max(0, Math.min(rate, 100)) * 3.6 + "deg");
        document.getElementById("updatedAt").textContent = state.updatedAt || "--";
      }

      function renderRows() {
        const box = document.getElementById("rows");
        let hasRisk = false;
        const body = state.rows.map((rawRow) => {
          const row = normalizeRow(rawRow);
          const m = calc(row);
          if (m.breach) hasRisk = true;
          const open = openRows.has(row.id);
          const tradeOpen = openTrades.has(row.id);
          const pnlClass = m.pnl === null ? "" : m.pnl > 0 ? "red" : m.pnl < 0 ? "green" : "";
          const badgeClass = m.breach ? "badge red" : m.over ? "badge amber" : "badge";
          const tradeStatus = tradePanelStatus(row, m);
          const rowMarketTotal = calcRowMarketTotal(rawRow);
          const testRow2Html = `
            <div class="position-test-row2-wrap" data-test-row2="${row.id}">
              <div class="position-main position-test-row2">
                ${htmlTestRow2Main(rawRow, m, tradeStatus)}
              </div>
            </div>`;
          const histHtml = (row.addHistory || [])
            .map((h, idx) => {
              const hm = calcHistLeg(h);
              const hp = idx + 1;
              const hPnlClass = hm.pnl === null ? "" : hm.pnl > 0 ? "red" : hm.pnl < 0 ? "green" : "";
              return `
            <div class="position-add-history-row-wrap">
              <div class="position-main position-add-history-row">
                <div class="stock-cell stock-cell-history">
                  <span class="history-tag">加仓${hp}</span>
                </div>
                ${dataCell("市值", money(hm.marketValue))}
                ${dataCell("现价", money(hm.displayCp))}
                ${dataCell("成本", money(hm.displayCost))}
                ${dataCell("预计持仓", shareLabel(hm.planned))}
                ${dataCell("持仓数量", shareLabel(hm.position))}
                ${dataCell("加仓止损", money(hm.addStopPrice))}
                ${dataCell("浮动盈亏", money(hm.pnl), hPnlClass)}
                <div class="data-cell"><span class="badge amber">加仓</span></div>
              </div>
            </div>`;
            })
            .join("");
          return `
          <div class="position-group">
            <article class="card position-card ${m.breach ? "risk" : ""} ${open ? "open" : ""} ${tradeOpen ? "trade" : ""}">
              <div class="position-main">
                <div class="stock-cell">
                  <input class="mono stock-code-input tab-field" data-row-id="${row.id}" data-field="symbol" value="${escapeHtml(row.symbol)}" placeholder="代码" oninput="setRowValue('${row.id}', 'symbol', this.value)" onblur="finishRowEdit()" />
                  <div class="stock-actions">
                    <button class="pill blue" type="button" onclick="toggleTrade('${row.id}', event)">${tradeOpen ? "收起" : "加仓"}</button>
                    <button class="pill" type="button" onclick="toggleRow('${row.id}'); event.stopPropagation()">${open ? "收起" : "风控"}</button>
                    <button class="pill red" type="button" onclick="deleteRow('${row.id}', event)">删</button>
                  </div>
                </div>
                <div class="data-cell mono" data-main-market="${row.id}"><small>市值</small><strong>${money(rowMarketTotal)}</strong></div>
                ${dataCell("现价", money(n(row.currentPrice)))}
                ${dataCell("成本", money(n(row.costPrice)))}
                ${dataCell("预计持仓", shareLabel(n(row.plannedPosition)))}
                ${dataCell("持仓数量", shareLabel(n(row.position)))}
                <div class="data-cell mono" data-main-add-stop="${row.id}"><small>加仓止损</small><strong>${money(m.addStopPrice)}</strong></div>
                ${dataCell("浮动盈亏", money(m.pnl), pnlClass)}
                <div class="data-cell"><span class="${badgeClass}">${m.alert}</span></div>
              </div>
              ${testRow2Html}
              <div class="detail">
                <div class="risk-intro">
                  <h3>风控 · 头寸录入</h3>
                  <p class="sub">在此填写现价、成本、预计持仓、持仓数量；填完后点<strong>确认</strong>写入主表并收起；亦可在「加仓」中<strong>合并到头寸</strong>。</p>
                </div>
                <div class="metrics" style="margin-top: 0">
                  <h3>头寸（主表数据源）</h3>
                  <div class="grid">
                    ${input(row, "currentPrice", "现价")}
                    ${input(row, "costPrice", "成本")}
                    ${input(row, "plannedPosition", "预计持仓")}
                    ${input(row, "position", "持仓数量")}
                  </div>
                </div>
                <div class="metrics">
                  <h3>止损与当日</h3>
                  <div class="grid">
                    ${input(row, "dayPnl", "当日盈亏")}
                    ${input(row, "stopLossAmount", "计划止损额")}
                  </div>
                </div>
                <div class="metrics">
                  <h3>加仓测算</h3>
                  <p class="sub" style="margin:0 0 8px">填写内容会同步到主表下方「测试行2」行，展示加仓合计（总加仓金额、总加仓数、总止损额等）。</p>
                  <div class="metric-grid mono">
                    ${metric("加仓止损价（与主表同列）", `<span data-add-metric-stop="${row.id}">${money(m.addStopPrice)}</span>`)}
                  </div>
                </div>
                <div class="metrics">
                  <h3>持仓状态雷达</h3>
                  <div class="metric-grid mono">
                    ${metric("预仓转换成本价", money(m.equiv))}
                    ${metric("恢复涨幅", pct(m.recovery), m.recovery !== null ? "purple" : "")}
                    ${metric("止损价", money(m.stop), m.breach ? "red" : "")}
                    ${metric("离场空间", pct(m.distance), m.breach ? "red" : "")}
                  </div>
                </div>
                <div class="confirm-row">
                  <button ${actionBtn(`confirmRisk('${row.id}', event)`)}>确认</button>
                  <span class="sub">写入主表并收起风控</span>
                </div>
              </div>
              <div class="trade-detail">
                <div class="trade-panel" data-add-panel="${row.id}">
                  <div class="drawer-head">
                    <div>
                      <p class="drawer-title">加仓</p>
                      <p class="sub">填写加仓价格、加仓数、止损额；合并后写入风控头寸与计划止损额；历次合并明细在主表下方展示。</p>
                    </div>
                    <span class="status-chip ${tradeStatus.className}" data-add-status="${row.id}">${tradeStatus.text}</span>
                  </div>
                  <div class="grid">
                    ${input(row, "addPrice", "加仓价格", "0.00", true)}
                    ${input(row, "addCount", "加仓数", "0.00", true)}
                    ${input(row, "addStopAmount", "止损额", row.stopLossAmount || "0.00", true)}
                  </div>
                  <div class="rr-line mono">
                    <div class="rr-box"><small>止损价位</small><strong data-add-stop-price="${row.id}">${money(m.addStopPrice)}</strong></div>
                    <div class="rr-box"><small>计算式</small><strong>(加价×加仓数−止损额)÷加仓数</strong></div>
                  </div>
                  <div class="merge-row">
                    <button ${actionBtn(`mergeAddIntoRisk('${row.id}', event)`)}>合并到头寸</button>
                    <span class="sub">加权成本 · 现价=加仓价 · 持仓+=加仓数 · 预计+=加仓数 · 止损额并入</span>
                  </div>
                </div>
              </div>
            </article>${histHtml}
          </div>`;
        }).join("");
        box.innerHTML = `
          <div class="monitor-scroll">
            <div class="monitor-table">
              <div class="table-head">
                <span>代码</span>
                <span>市值</span>
                <span>现价</span>
                <span>成本</span>
                <span>预计持仓</span>
                <span>持仓数量</span>
                <span>加仓止损</span>
                <span>浮动盈亏</span>
                <span>状态</span>
              </div>
              ${body}
            </div>
          </div>`;
        updateRiskPulse(hasRisk);
      }

      function input(row, key, label, placeholder = "0.00", syncAdd = false) {
        const oninput = syncAdd
          ? `setRowValue('${row.id}', '${key}', this.value); syncAddPreview('${row.id}');`
          : `setRowValue('${row.id}', '${key}', this.value)`;
        return `<div class="field"><label>${label}</label><input class="mono tab-field" data-row-id="${row.id}" data-field="${key}" type="number" inputmode="decimal" value="${escapeHtml(row[key])}" placeholder="${escapeHtml(placeholder)}" oninput="${oninput}" onblur="finishRowEdit()" /></div>`;
      }

      function summary(label, value, className = "") {
        return `<div><small>${label}</small><strong class="${className}">${value}</strong></div>`;
      }

      function dataCell(label, value, className = "") {
        return `<div class="data-cell mono"><small>${label}</small><strong class="${className}">${value}</strong></div>`;
      }

      function dataCellNamed(label, value, className = "") {
        return `<div class="data-cell mono data-cell-named"><small>${label}</small><strong class="${className}">${value}</strong></div>`;
      }

      function metric(label, value, className = "") {
        return `<div class="metric"><span>${label}</span><strong class="${className}">${value}</strong></div>`;
      }

      function updateRiskPulse(hasRisk) {
        document.getElementById("topAlert").classList.toggle("on", hasRisk);
        if (hasRisk && !lastRiskPulse && navigator.vibrate) navigator.vibrate([45, 70, 45]);
        lastRiskPulse = hasRisk;
      }

      function tradePanelStatus(row, m) {
        const ac = n(row.addCount);
        if (ac === 0 || ac < 0) return { text: "加仓数无效", className: "bad" };
        if (m.addStopPrice === null) return { text: "待输入", className: "" };
        return { text: "已生成", className: "ok" };
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[char]);
      }

      function render() {
        state.rows = state.rows.map(normalizeRow);
        renderGlobal();
        renderRows();
      }

      function saveLocal() {
        state.updatedAt = new Date().toLocaleString("zh-CN", { hour12: false });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        renderGlobal();
        alert("已保存到浏览器本地存储");
      }

      function exportJson() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "postiton-ol-data.json";
        a.click();
        URL.revokeObjectURL(url);
      }

      function resetAll() {
        if (!confirm("确定要清空当前页面数据吗？")) return;
        state = { globalHeader: defaultGlobalHeader(), rows: Array.from({ length: 4 }, emptyRow), updatedAt: "--" };
        openRows.clear();
        openTrades.clear();
        render();
      }

      globalKeys.forEach((key) => {
        document.addEventListener("input", (event) => {
          if (event.target && event.target.id === key) {
            state.globalHeader[key] = event.target.value;
            renderGlobal();
          }
        });
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Tab") return;
        const active = document.activeElement;
        if (!active || active.tagName !== "INPUT") return;
        if (!getTabInputs().includes(active)) return;
        event.preventDefault();
        focusTabRelative(event.shiftKey);
      });

      document.getElementById("importFile").addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        state = JSON.parse(await file.text());
        state.globalHeader = normalizeGlobalHeader(state.globalHeader);
        event.target.value = "";
        render();
      });

      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          state = JSON.parse(saved);
          state.globalHeader = normalizeGlobalHeader(state.globalHeader);
          state.rows = (state.rows || []).map(normalizeRow);
        } catch {
          state.globalHeader = defaultGlobalHeader();
          state.rows = Array.from({ length: 4 }, emptyRow);
        }
      } else {
        state.rows = Array.from({ length: 4 }, emptyRow);
      }
      render();
    </script>
  </body>
</html>
