<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>POSTITON OL HTML</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0b0f;
        color: #f2f2f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .card {
        width: min(390px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid #3a3a3c;
        border-radius: 28px;
        background: #1c1c1e;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }

      p {
        margin: 0 0 20px;
        color: #8e8e93;
        line-height: 1.6;
      }

      a {
        display: block;
        padding: 14px 18px;
        border-radius: 16px;
        background: #0a84ff;
        color: white;
        text-align: center;
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>POSTITON OL</h1>
      <p>这是静态 HTML 入口页。Vercel/Next 项目的正式主页在根路径 `/`，完整独立 HTML 文件在项目根目录 `index.html`。</p>
      <a href="/">进入线上网页端</a>
    </main>
  </body>
</html>
