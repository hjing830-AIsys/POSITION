<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UX UI Guide Editor</title>
    <style>
      :root {
        color-scheme: dark;
        --root: #06060a;
        --panel: rgba(18, 18, 24, 0.92);
        --text: #f7f7fb;
        --muted: #8e8e99;
        --cyan: #18f2ff;
        --red: #ff453a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--root);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .toolbar {
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        z-index: 20;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
        background: var(--panel);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.46);
        backdrop-filter: blur(22px);
      }

      .title {
        min-width: 0;
      }

      h1 {
        margin: 0;
        font-size: 15px;
        letter-spacing: -0.03em;
      }

      .hint {
        overflow: hidden;
        margin-top: 3px;
        color: var(--muted);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: flex-end;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 8px 10px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.09);
        font: inherit;
        font-size: 12px;
        font-weight: 850;
      }

      button.primary {
        color: #061014;
        background: var(--cyan);
      }

      button.red {
        color: #ffd8d5;
        background: rgba(255, 69, 58, 0.18);
      }

      .stage {
        position: fixed;
        inset: 70px 0 0;
        overflow: auto;
        background:
          radial-gradient(circle at 80% 0%, rgba(24, 242, 255, 0.1), transparent 30%),
          var(--root);
      }

      iframe {
        display: block;
        width: 100%;
        min-height: 100%;
        border: 0;
      }

      @media (max-width: 520px) {
        .toolbar {
          grid-template-columns: 1fr;
        }

        .stage {
          top: 118px;
        }

        .actions {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <div class="title">
        <h1>UX.html · index.html UI 指引编辑器</h1>
        <div class="hint" id="status">点击页面里的任意元素选中；可放大、缩小、删除，然后保存为 UI 指引。</div>
      </div>
      <div class="actions">
        <button onclick="scaleSelected(1.08)">放大</button>
        <button onclick="scaleSelected(0.92)">缩小</button>
        <button class="red" onclick="deleteSelected()">删除</button>
        <button onclick="resetGuide()">重置</button>
        <button class="primary" onclick="saveGuide()">保存指引</button>
      </div>
    </header>

    <main class="stage">
      <iframe id="preview" title="UX editable preview"></iframe>
    </main>

    <script>
      const GUIDE_KEY = "postiton_ol_ux_guide_html_v1";
      const preview = document.getElementById("preview");
      const status = document.getElementById("status");
      let selected = null;

      function loadGuide() {
        const saved = localStorage.getItem(GUIDE_KEY);
        if (saved) {
          preview.srcdoc = saved;
          return;
        }

        preview.removeAttribute("srcdoc");
        preview.src = "index.html";
        status.textContent = "正在加载 index.html，加载完成后点击任意元素即可选中。";
      }

      preview.addEventListener("load", () => {
        injectEditor();
      });

      function injectEditor() {
        let doc;
        try {
          doc = preview.contentDocument || preview.contentWindow.document;
        } catch {
          status.textContent = "当前预览环境限制了 iframe 编辑权限，请用浏览器直接打开 UX.html。";
          return;
        }
        if (!doc || !doc.body) {
          status.textContent = "页面还没加载完成，请稍后再点。";
          return;
        }

        const style = doc.createElement("style");
        style.textContent = `
          [data-ux-selected="true"] {
            outline: 2px solid #18f2ff !important;
            outline-offset: 2px !important;
            box-shadow: 0 0 0 6px rgba(24, 242, 255, 0.18) !important;
          }
          *:hover {
            outline: 1px dashed rgba(24, 242, 255, 0.45);
            outline-offset: 1px;
          }
          html, body {
            user-select: none;
          }
        `;
        doc.head.appendChild(style);

        const pick = (event) => {
          event.preventDefault();
          event.stopPropagation();
          selectElement(event.target);
        };
        doc.addEventListener("pointerdown", pick, true);
        doc.addEventListener("click", pick, true);
        status.textContent = "编辑模式已开启：点击页面元素选中，然后放大、缩小或删除。";
      }

      function selectElement(element) {
        if (!element || element === preview.contentDocument.documentElement || element === preview.contentDocument.body) return;
        if (selected) selected.removeAttribute("data-ux-selected");
        selected = element;
        selected.setAttribute("data-ux-selected", "true");
        status.textContent = `已选中：${selected.tagName.toLowerCase()}${selected.className ? "." + String(selected.className).split(" ").join(".") : ""}`;
      }

      function scaleSelected(factor) {
        if (!selected) {
          status.textContent = "请先点击选中一个元素。";
          return;
        }
        const current = Number(selected.dataset.uxScale || "1");
        const next = Math.max(0.25, Math.min(3, current * factor));
        selected.dataset.uxScale = String(next);
        selected.style.transformOrigin = "top left";
        selected.style.transform = `scale(${next})`;
        status.textContent = `缩放比例：${Math.round(next * 100)}%`;
      }

      function deleteSelected() {
        if (!selected) {
          status.textContent = "请先点击选中一个元素。";
          return;
        }
        if (!confirm("确定删除当前选中的元素吗？")) return;
        const next = selected.parentElement;
        selected.remove();
        selected = next;
        status.textContent = "已删除选中元素。";
      }

      function saveGuide() {
        let doc;
        try {
          doc = preview.contentDocument || preview.contentWindow.document;
        } catch {
          status.textContent = "无法读取预览页面，当前环境不允许保存。";
          return;
        }
        if (!doc) return;
        if (selected) selected.removeAttribute("data-ux-selected");
        localStorage.setItem(GUIDE_KEY, "<!doctype html>\n" + doc.documentElement.outerHTML);
        status.textContent = "已保存到浏览器本地存储，可作为 index.html 的 UI 指引。";
      }

      function resetGuide() {
        if (!confirm("确定清空 UX 指引并重新读取 index.html 吗？")) return;
        localStorage.removeItem(GUIDE_KEY);
        selected = null;
        loadGuide();
      }

      loadGuide();
    </script>
  </body>
</html>
